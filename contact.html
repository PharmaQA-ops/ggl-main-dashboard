<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0878e8">
<title>Gaerish Digital Business Card</title>
<style>
*{box-sizing:border-box}
:root{
 --blue:#0878e8;--blue2:#20b7f2;--ink:#0b2d52;--muted:#6d849b;
 --glass:rgba(255,255,255,.72);--line:rgba(255,255,255,.88);
 --shadow:0 28px 80px rgba(8,78,140,.20)
}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;
 position:relative;overflow-x:hidden;
 background:
 radial-gradient(circle at 8% 8%,rgba(58,173,255,.55),transparent 32%),
 radial-gradient(circle at 92% 12%,rgba(38,211,255,.42),transparent 30%),
 radial-gradient(circle at 50% 95%,rgba(79,145,255,.25),transparent 35%),
 linear-gradient(135deg,#eaf7ff,#cfeaff 48%,#f8fcff)
}
body:before,body:after{
 content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(35px);
 pointer-events:none;mix-blend-mode:screen
}
body:before{
 width:240px;height:240px;left:-70px;top:28%;background:rgba(0,178,255,.28);
 animation:liquidFloat 9s ease-in-out infinite alternate
}
body:after{
 width:280px;height:280px;right:-90px;bottom:8%;background:rgba(55,120,255,.25);
 animation:liquidFloat2 11s ease-in-out infinite alternate
}
@keyframes liquidFloat{to{transform:translate(55px,-35px) scale(1.15)}}
@keyframes liquidFloat2{to{transform:translate(-45px,-25px) scale(1.12)}}
.shell{width:min(520px,100%);position:relative}
.shell:before{
 content:"";position:absolute;inset:12% -10% -8%;z-index:-1;
 background:radial-gradient(circle,rgba(71,181,255,.30),transparent 62%);
 filter:blur(35px)
}
.card{
 position:relative;overflow:hidden;border-radius:34px;
 background:linear-gradient(135deg,rgba(255,255,255,.48),rgba(255,255,255,.20));
 border:1px solid rgba(255,255,255,.88);
 box-shadow:0 30px 90px rgba(8,78,140,.22),inset 0 1px 0 rgba(255,255,255,.95);
 backdrop-filter:blur(34px) saturate(180%) contrast(110%);
 -webkit-backdrop-filter:blur(34px) saturate(180%) contrast(110%)
}
.card:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:
 radial-gradient(circle at 18% 0%,rgba(255,255,255,.72),transparent 28%),
 radial-gradient(circle at 92% 38%,rgba(117,211,255,.18),transparent 32%),
 linear-gradient(115deg,rgba(255,255,255,.18),transparent 35%,rgba(255,255,255,.08));
 mix-blend-mode:screen
}
.card:after{
 content:"";position:absolute;left:8%;right:8%;top:0;height:1px;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
 pointer-events:none
}
.shell{width:min(520px,100%);position:relative}
.card{
 overflow:hidden;border-radius:34px;background:var(--glass);border:1px solid var(--line);
 box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px)
}
.brand-strip{position:relative;padding:18px 20px 14px;display:flex;justify-content:center;align-items:center;border-bottom:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.company-logo{width:180px;height:66px;object-fit:contain;background:rgba(255,255,255,.88);border-radius:18px;padding:7px;border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 28px rgba(15,80,130,.13),inset 0 1px 0 #fff}
.profile{padding:24px 24px 20px;text-align:center}
.photo-wrap{position:relative;width:132px;height:132px;margin:0 auto 15px}
.photo-ring{position:absolute;inset:0;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--blue),var(--blue2))}
.photo-box{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#dceeff;border:4px solid #fff;box-shadow:0 12px 30px rgba(8,78,140,.20)}
.photo{width:100%;height:100%;object-fit:cover;display:none}
.initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:900;background:linear-gradient(135deg,#0878e8,#20b7f2)}
.name{margin:0;font-size:28px;line-height:1.08;font-weight:900;letter-spacing:-.7px}
.designation{margin-top:7px;font-size:14px;font-weight:800;color:#315e84}
.department{margin-top:3px;font-size:11px;color:#7690a7}
.company{margin-top:11px;font-size:12px;font-weight:900;color:#0878e8}
.company-switcher{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:15px auto 0}
.company-chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 5px 16px rgba(12,80,130,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.company-chip{
 border:1px solid #d6e8f6;background:rgba(255,255,255,.78);border-radius:999px;
 padding:7px 10px;display:inline-flex;align-items:center;gap:6px;color:#315e84;
 font-size:10px;font-weight:850;cursor:pointer
}
.company-chip img{width:18px;height:18px;object-fit:contain;background:#fff;border-radius:5px}
.company-chip.active{border-color:#1688e8;background:#e8f6ff;color:#075b9d;box-shadow:0 5px 14px rgba(22,136,232,.12)}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:18px}
.badge{
 width:62px;height:62px;position:relative;display:flex;align-items:center;justify-content:center;
 clip-path:polygon(25% 3%,75% 3%,97% 25%,97% 75%,75% 97%,25% 97%,3% 75%,3% 25%);
 filter:drop-shadow(0 7px 9px rgba(12,72,120,.15))
}
.badge::before{content:"";position:absolute;inset:4px;clip-path:inherit;background:linear-gradient(135deg,var(--c1),var(--c2))}
.badge-inner{position:relative;z-index:1;width:52px;height:52px;clip-path:polygon(25% 3%,75% 3%,97% 25%,97% 75%,75% 97%,25% 97%,3% 75%,3% 25%);background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.badge-icon{font-size:14px;line-height:1;margin-bottom:4px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.badge-label{font-size:6px;line-height:1.05;font-weight:950;letter-spacing:.35px;max-width:57px}
.details{padding:0 20px 8px}
.detail{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:15px;background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.62);margin:7px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 22px rgba(15,85,140,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.icon{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#e9f6ff;color:#0878e8;font-weight:950;font-size:13px}
.detail-text{min-width:0}
.detail-label{font-size:8px;font-weight:900;letter-spacing:.7px;color:#7890a7;text-transform:uppercase}
.detail-value{margin-top:2px;font-size:11px;font-weight:750;overflow-wrap:anywhere}
.detail-value a{color:inherit;text-decoration:none}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:18px 20px 20px}
.btn{border:0;border-radius:13px;padding:12px 9px;font-size:10px;font-weight:900}
.btn-primary{color:#fff;background:linear-gradient(135deg,#0878e8,#19b7ef);box-shadow:0 9px 18px rgba(8,120,232,.20)}
.btn-secondary{color:var(--ink);background:rgba(255,255,255,.84);border:1px solid #d8e8f4}
.footer{text-align:center;padding:13px;border-top:1px solid #dcecf7;color:#7891a8;font-size:9px;font-weight:700}
.loader,.error-card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#edf8ff,#d9efff);z-index:50}
.loader-box,.error-box{width:min(420px,94vw);padding:28px;border-radius:25px;background:rgba(255,255,255,.78);border:1px solid #fff;text-align:center;box-shadow:var(--shadow);backdrop-filter:blur(22px)}
.spinner{width:34px;height:34px;margin:auto;border:3px solid #dbeafa;border-top-color:#0878e8;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-card{display:none}.hidden{display:none!important}
.error-icon{font-size:34px}.error-box h2{margin:8px 0}.error-box p{font-size:12px;color:var(--muted)}
@media(max-width:430px){
 body{padding:10px}.card{border-radius:27px}.profile{padding:20px 15px 16px}.name{font-size:25px}
 .photo-wrap{width:118px;height:118px}.buttons{grid-template-columns:1fr;padding:15px}
 .company-logo{width:155px;height:58px}.badge{width:58px;height:58px}.badge-inner{width:49px;height:49px}
}
</style>
</head>
<body>
<div class="shell">
  <main class="card" id="card" style="display:none">
    <div class="brand-strip">
      <img id="companyLogo" class="company-logo" alt="Company logo">
    </div>

    <section class="profile">
      <div class="photo-wrap">
        <div class="photo-ring">
          <div class="photo-box">
            <img id="photo" class="photo" alt="Employee photo">
            <div id="initials" class="initials">G</div>
          </div>
        </div>
      </div>

      <h1 class="name" id="name"></h1>
      <div class="designation" id="designation"></div>
      <div class="department" id="department"></div>
      <div class="company" id="company"></div>
      <div class="company-switcher" id="companySwitcher"></div>
      <div class="badges" id="badges"></div>
    </section>

    <section class="details">
      <div class="detail" id="mobileRow"><div class="icon">☎</div><div class="detail-text"><div class="detail-label">Mobile</div><div class="detail-value" id="mobile"></div></div></div>
      <div class="detail" id="whatsappRow"><div class="icon">WA</div><div class="detail-text"><div class="detail-label">WhatsApp</div><div class="detail-value" id="whatsapp"></div></div></div>
      <div class="detail" id="emailRow"><div class="icon">@</div><div class="detail-text"><div class="detail-label">Email</div><div class="detail-value" id="email"></div></div></div>
      <div class="detail" id="websiteRow"><div class="icon">↗</div><div class="detail-text"><div class="detail-label">Website</div><div class="detail-value" id="website"></div></div></div>
      <div class="detail" id="linkedinRow"><div class="icon">in</div><div class="detail-text"><div class="detail-label">LinkedIn</div><div class="detail-value" id="linkedin"></div></div></div>
      <div class="detail" id="addressRow"><div class="icon">⌖</div><div class="detail-text"><div class="detail-label">Office</div><div class="detail-value" id="address"></div></div></div>
    </section>

    <div class="buttons">
      <button class="btn btn-primary" onclick="addToContacts()">Add to Contacts</button>
      <button class="btn btn-secondary" onclick="shareCard()">Share Contact</button>
      <button class="btn btn-secondary" onclick="copyCardLink()">Copy Contact Link</button>
    </div>
    <div class="footer" id="footer">Digital Business Card</div>
  </main>
</div>

<div class="loader" id="loader">
  <div class="loader-box"><div class="spinner"></div><div style="margin-top:13px;font-weight:900;font-size:13px">Loading contact</div><div style="margin-top:4px;color:#7891a8;font-size:10px">Gaerish Digital Business Card</div></div>
</div>

<div class="error-card" id="errorCard">
  <div class="error-box">
    <div class="error-icon">⚠</div>
    <h2>Contact unavailable</h2>
    <p id="errorMessage">The requested employee contact could not be found.</p>
  </div>
</div>

<script>
'use strict';

const API_URL='https://script.google.com/macros/s/AKfycbyOnaQEYIqjIqdAeBY8KNk0brPmJ4IvBA5pPHfvdDhP18zFknmOwmPw8R-9PG8hS7lLIg/exec';

const COMPANY_ASSETS={
  LOGISTICS:{name:'Gaerish Logistics Pvt Ltd',shortName:'Gaerish Logistics',logo:'logo.png',website:'https://www.gaerishlogistics.com',c1:'#0878e8',c2:'#20b7f2'},
  DEFENCE:{name:'Gaerish Defence Pvt Ltd',shortName:'Gaerish Defence',logo:'logo1.png',website:'',c1:'#123a61',c2:'#4e8ac7'},
  ETRADE:{name:'Gaerish eTrade Pvt Ltd',shortName:'Gaerish eTrade',logo:'logo2.png',website:'',c1:'#0a8f70',c2:'#35c6a4'}
};

let employee=null;
let employeeId='';
let selectedCompany='';

document.addEventListener('DOMContentLoaded',loadContact);

function loadContact(){
  const params=new URLSearchParams(window.location.search);
  employeeId=(params.get('employee')||params.get('id')||'').trim().toUpperCase();
  selectedCompany=normalizeCompany(params.get('company'));
  if(!employeeId){showError('Employee ID is missing from the contact link.');return;}

  const callbackName='gglContactCallback_'+Date.now();
  const script=document.createElement('script');

  window[callbackName]=function(response){
    try{
      if(!response||!response.success||!response.employee){showError(getApiError(response));return;}
      employee=response.employee;
      if(!selectedCompany || !(employee.companies||[]).includes(selectedCompany)){
        selectedCompany=employee.companyKey||((employee.companies||[])[0]||'LOGISTICS');
      }
      renderContact(employee);
    }catch(error){showError(error.message);}
    finally{cleanupJsonp(script,callbackName);}
  };

  script.src=API_URL+'?action=contact&employee='+encodeURIComponent(employeeId)+'&company='+encodeURIComponent(selectedCompany||'')+'&callback='+encodeURIComponent(callbackName)+'&v=company3';
  script.onerror=function(){showError('Unable to connect to the contact service.');cleanupJsonp(script,callbackName);};
  document.body.appendChild(script);
}

function switchCompany(key){
  key=normalizeCompany(key);
  if(!employee || !(employee.companies||[]).includes(key)) return;
  const url=new URL(window.location.href);
  url.searchParams.set('employee',employee.employeeId);
  url.searchParams.set('company',key);
  window.location.href=url.toString();
}

function renderContact(data){
  const company=data.companies&&data.companies.length
    ? data.companies.find(c=>c.key===selectedCompany)||data.companies[0]
    : {key:selectedCompany||'LOGISTICS',name:data.company,logo:COMPANY_ASSETS[selectedCompany||'LOGISTICS'].logo,website:data.website};

  selectedCompany=company.key;
  document.getElementById('companyLogo').src=company.logo||COMPANY_ASSETS[selectedCompany].logo;
  document.getElementById('companyLogo').alt=company.name+' logo';

  setText('name',data.name);
  setText('designation',data.designation);
  setText('department',data.department);
  setText('company',company.name);

  renderCompanySwitcher(data.companies||[]);
  renderPhoto(data.photo,data.name);
  renderMobile(data.mobile);
  renderWhatsApp(data.whatsapp);
  renderEmail(data.email);
  renderWebsite(data.website||company.website);
  renderLinkedIn(data.linkedin);
  renderAddress(data.address);
  renderBadges(data.badges||[]);

  document.getElementById('footer').textContent='Digital Business Card · '+company.name;
  document.getElementById('card').style.display='block';
  document.getElementById('loader').classList.add('hidden');
}

function renderCompanySwitcher(companies){
  const box=document.getElementById('companySwitcher');
  if(!companies||companies.length<2){box.innerHTML='';return;}
  box.innerHTML=companies.map(function(c){
    return '<button class="company-chip '+(c.key===selectedCompany?'active':'')+'" onclick="switchCompany(\''+js(c.key)+'\')" title="'+escapeHtml(c.name)+'"><img src="'+escapeAttr(c.logo)+'" alt=""><span>'+escapeHtml(c.shortName||c.name)+'</span></button>';
  }).join('');
}

function renderBadges(list){
  const box=document.getElementById('badges');
  if(!list.length){box.innerHTML='';return;}
  box.innerHTML=list.map(function(b){
    const key=String(b.badgeKey||'').toUpperCase();
    const marks={DG:'⚡',PHARMA:'✚',PROJECTS:'◆',QA:'✓',OPERATIONS:'⚙',SALES:'↗',FINANCE:'₹',HR:'●●',IT:'▣',MANAGEMENT:'♛',SPECIALIST:'★',ENTHUSIAST:'♥',INITIATOR:'⚡',SUPPORT:'◉'};
    const c1='#'+(b.color1||'4AAEFF'),c2='#'+(b.color2||'1768C0');
    return '<div class="badge" style="--c1:'+c1+';--c2:'+c2+'" title="'+escapeAttr(b.description||b.label||'')+'"><div class="badge-inner"><div class="badge-icon">'+(marks[key]||'★')+'</div><div class="badge-label">'+escapeHtml(b.label||b.badgeName||key)+'</div></div></div>';
  }).join('');
}

function renderPhoto(url,name){
  const photo=document.getElementById('photo'),initials=document.getElementById('initials');
  if(!url){showInitials(name);return;}
  photo.onload=function(){photo.style.display='block';initials.style.display='none';};
  photo.onerror=function(){showInitials(name);};
  photo.src=normalizePhotoUrl(url);
}

function normalizePhotoUrl(value){
  const url=String(value||'').trim();
  if(!url)return '';
  const m=url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m)return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w800';
  return url;
}

function showInitials(name){
  document.getElementById('photo').style.display='none';
  const el=document.getElementById('initials');el.textContent=getInitials(name);el.style.display='flex';
}

function renderMobile(value){
  const row=document.getElementById('mobileRow'),target=document.getElementById('mobile');
  if(!value){row.style.display='none';return;} row.style.display='flex';target.innerHTML='<a href="tel:'+encodeURIComponent(value)+'">'+escapeHtml(value)+'</a>';
}
function renderWhatsApp(value){
  const row=document.getElementById('whatsappRow'),target=document.getElementById('whatsapp');
  if(!value){row.style.display='none';return;} row.style.display='flex';
  const digits=String(value).replace(/\D/g,'');target.innerHTML='<a href="https://wa.me/'+digits+'" target="_blank" rel="noopener">'+escapeHtml(value)+'</a>';
}
function renderEmail(value){
  const row=document.getElementById('emailRow'),target=document.getElementById('email');
  if(!value){row.style.display='none';return;} row.style.display='flex';target.innerHTML='<a href="mailto:'+encodeURIComponent(value)+'">'+escapeHtml(value)+'</a>';
}
function renderWebsite(value){
  const row=document.getElementById('websiteRow'),target=document.getElementById('website');
  if(!value){row.style.display='none';return;} row.style.display='flex';
  const url=normalizeUrl(value);target.innerHTML='<a href="'+escapeAttr(url)+'" target="_blank" rel="noopener">'+escapeHtml(url.replace(/^https?:\/\//i,''))+'</a>';
}
function renderLinkedIn(value){
  const row=document.getElementById('linkedinRow'),target=document.getElementById('linkedin');
  if(!value){row.style.display='none';return;} row.style.display='flex';
  const url=normalizeUrl(value);target.innerHTML='<a href="'+escapeAttr(url)+'" target="_blank" rel="noopener">LinkedIn Profile</a>';
}
function renderAddress(value){
  const row=document.getElementById('addressRow'),target=document.getElementById('address');
  if(!value){row.style.display='none';return;} row.style.display='flex';target.textContent=value;
}

async function addToContacts(){
  if(!employee)return;
  const data=Object.assign({},employee,{company:currentCompany().name,website:employee.website||currentCompany().website});
  const vcard=createVCard(data);
  const safeName=String(employee.name||employee.employeeId||'contact').replace(/[^a-z0-9 _-]/gi,'').trim()||'contact';
  const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
  try{
    const file=new File([blob],safeName+'.vcf',{type:'text/vcard'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:employee.name||'Gaerish Contact',text:'Save this contact to your phone.',files:[file]});
      return;
    }
  }catch(error){if(error&&error.name==='AbortError')return;}
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=safeName+'.vcf';link.style.display='none';document.body.appendChild(link);link.click();link.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},3000);
}

function createVCard(data){
  let v='BEGIN:VCARD\r\nVERSION:3.0\r\n';
  v+='FN:'+vcardEscape(data.name)+'\r\n';
  v+='N:'+vcardEscape(data.name)+';;;;\r\n';
  if(data.company)v+='ORG:'+vcardEscape(data.company)+'\r\n';
  if(data.designation)v+='TITLE:'+vcardEscape(data.designation)+'\r\n';
  if(data.department)v+='ROLE:'+vcardEscape(data.department)+'\r\n';
  if(data.mobile)v+='TEL;TYPE=CELL,WORK:'+vcardEscape(data.mobile)+'\r\n';
  if(data.whatsapp&&data.whatsapp!==data.mobile)v+='TEL;TYPE=WORK:'+vcardEscape(data.whatsapp)+'\r\n';
  if(data.email)v+='EMAIL;TYPE=WORK:'+vcardEscape(data.email)+'\r\n';
  if(data.website)v+='URL:'+vcardEscape(normalizeUrl(data.website))+'\r\n';
  if(data.linkedin)v+='X-SOCIALPROFILE;TYPE=linkedin:'+vcardEscape(normalizeUrl(data.linkedin))+'\r\n';
  if(data.address)v+='ADR;TYPE=WORK:;;'+vcardEscape(data.address)+';;;;\r\n';
  if(data.employeeId)v+='NOTE:GGL Employee ID - '+vcardEscape(data.employeeId)+'\r\n';
  v+='END:VCARD'; return v;
}

async function shareCard(){
  const url=window.location.href;
  if(navigator.share){try{await navigator.share({title:employee?employee.name:'GGL Contact',text:employee?employee.name+' — '+(employee.designation||currentCompany().name):'Gaerish contact',url:url});return;}catch(error){if(error&&error.name==='AbortError')return;}}
  copyText(url,'Contact link copied.');
}
function copyCardLink(){copyText(window.location.href,'Contact link copied.');}
async function copyText(text,msg){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(text);
    else{const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();document.execCommand('copy');input.remove();}
    alert(msg);
  }catch(error){alert('Unable to copy the contact link.');}
}

function currentCompany(){
  return (employee&&employee.companies||[]).find(function(c){return c.key===selectedCompany;})||COMPANY_ASSETS[selectedCompany]||COMPANY_ASSETS.LOGISTICS;
}
function normalizeCompany(value){
  const raw=String(value||'').trim().toUpperCase();
  const aliases={'GAERISH LOGISTICS':'LOGISTICS','GAERISH LOGISTICS PVT LTD':'LOGISTICS','GAERISH DEFENCE':'DEFENCE','GAERISH DEFENCE PVT LTD':'DEFENCE','GAERISH ETRADE':'ETRADE','GAERISH ETRADE PVT LTD':'ETRADE','E-TRADE':'ETRADE'};
  return aliases[raw]||raw;
}
function getApiError(r){
  if(!r)return 'No response received from the contact service.';
  return ({EMPLOYEE_ID_REQUIRED:'Employee ID is missing.',EMPLOYEE_NOT_FOUND:'Employee contact was not found.',CONTACT_UNAVAILABLE:'This employee contact is currently unavailable.',INVALID_CALLBACK:'Invalid contact request.'})[r.error]||r.error||'Contact unavailable.';
}
function showError(message){
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('card').style.display='none';
  document.getElementById('errorCard').style.display='flex';
  document.getElementById('errorMessage').textContent=message||'The requested employee contact could not be found.';
}
function cleanupJsonp(script,callbackName){if(script)script.remove();try{delete window[callbackName];}catch(e){window[callbackName]=undefined;}}
function setText(id,value){document.getElementById(id).textContent=value||'';}
function getInitials(name){const p=String(name||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return'G';if(p.length===1)return p[0].substring(0,2).toUpperCase();return(p[0][0]+p[p.length-1][0]).toUpperCase();}
function normalizeUrl(value){const t=String(value||'').trim();if(!t)return'';return/^https?:\/\//i.test(t)?t:'https://'+t;}
function escapeHtml(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function escapeAttr(value){return escapeHtml(value);}
function js(value){return String(value||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
</script>
