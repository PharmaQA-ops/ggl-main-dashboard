<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"

>

<meta
name="theme-color"
content="#0b1220"

>

  <title>
    Gaerish Logistics — Digital Contact
  </title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(86,190,255,.34), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(16,105,207,.30), transparent 34%),
        linear-gradient(145deg, #d9efff 0%, #eef8ff 45%, #c8e6fb 100%);
      background-attachment: fixed;
      color: #101828;
    }


    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(8px, 2.5vw, 24px);
      overflow-x: hidden;
    }


    .page {
      width: min(100%, 460px);
      max-width: 460px;
      margin: 0 auto;
    }


    .card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(145deg, rgba(255,255,255,.48), rgba(226,242,255,.20)),
        rgba(255,255,255,.24);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 32px;
      box-shadow:
        0 35px 90px rgba(10,73,132,.20),
        inset 0 1px 0 rgba(255,255,255,.88),
        inset 0 -1px 0 rgba(255,255,255,.18);
      backdrop-filter: blur(30px) saturate(155%);
      -webkit-backdrop-filter: blur(30px) saturate(155%);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      border-radius: 31px;
      background:
        radial-gradient(circle at 8% 5%, rgba(255,255,255,.72), transparent 28%),
        radial-gradient(circle at 95% 90%, rgba(54,161,255,.20), transparent 34%);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 170%;
      height: 120px;
      left: -35%;
      top: -65px;
      transform: rotate(-8deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.40), transparent);
      filter: blur(18px);
      pointer-events: none;
    }


    .cover {
      height: 145px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.46), transparent 25%),
        radial-gradient(circle at 88% 80%, rgba(81,190,255,.42), transparent 34%),
        linear-gradient(135deg, #0877d1 0%, #0b5bb3 45%, #07356f 100%);
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 20%, rgba(255,255,255,.18) 45%, transparent 70%);
      transform: translateX(-60%);
      animation: glassSweep 7s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glassSweep {
      0%, 45% { transform: translateX(-65%); }
      75%, 100% { transform: translateX(65%); }
    }


    .content {
      padding: 0 25px 25px;
      text-align: center;
    }


    .photo-wrap {
      width: 132px;
      height: 132px;
      margin: -66px auto 17px;
      position: relative;
      z-index: 5;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,.95), rgba(157,220,255,.52));
      box-shadow:
        0 18px 42px rgba(0,67,128,.25),
        0 0 0 1px rgba(255,255,255,.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }


    .photo {
      width: 124px;
      height: 124px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.94);
      background: #eaf6ff;
      box-shadow:
        0 10px 28px rgba(0,55,110,.22);
      display: block;
      opacity: 1;
    }


    .initials {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid #fff;
      background: #0b1220;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      box-shadow:
        0 8px 30px rgba(15,23,42,.18);
    }


    .name {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.4px;
    }


    .designation {
      margin-top: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #475467;
    }


    .department {
      margin-top: 3px;
      font-size: 12px;
      color: #667085;
    }


    .company {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }



    /* =====================================================
       DEPARTMENT / SPECIALTY BADGES
       ===================================================== */

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin: 12px auto 0;
      max-width: 100%;
    }

    .badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.78);
      background: rgba(255,255,255,.34);
      color: #0b4278;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .35px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow:
        0 5px 16px rgba(16,92,160,.10),
        inset 0 1px 0 rgba(255,255,255,.72);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      flex: 0 0 6px;
    }

    .badge-dg {
      color: #0756b8;
      background: rgba(83,169,255,.18);
    }

    .badge-pharma {
      color: #08756c;
      background: rgba(71,211,190,.18);
    }

    .badge-projects {
      color: #6941c6;
      background: rgba(167,139,250,.18);
    }

    .badge-qa {
      color: #b54708;
      background: rgba(255,184,92,.18);
    }

    .badge-operations {
      color: #175cd3;
      background: rgba(99,153,255,.18);
    }

    .badge-sales {
      color: #027a48;
      background: rgba(72,207,137,.18);
    }

    .badge-finance {
      color: #1570ef;
      background: rgba(96,165,250,.18);
    }

    .badge-hr {
      color: #c11574;
      background: rgba(244,114,182,.16);
    }

    .badge-it {
      color: #3538cd;
      background: rgba(129,140,248,.18);
    }

    .badge-management {
      color: #344054;
      background: rgba(152,162,179,.20);
    }

    .badge-default {
      color: #0b4278;
      background: rgba(255,255,255,.38);
    }

    @media (max-width: 360px) {
      .badges {
        gap: 5px;
        margin-top: 10px;
      }

      .badge {
        min-height: 26px;
        padding: 5px 9px;
        font-size: 9px;
      }
    }


    .divider {
      height: 1px;
      background: #eaecf0;
      margin: 21px 0;
    }


    .details {
      text-align: left;
      display: grid;
      gap: 11px;
    }


    .detail {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 13px;
      border-radius: 17px;
      background: linear-gradient(135deg, rgba(255,255,255,.46), rgba(231,246,255,.22));
      border: 1px solid rgba(255,255,255,.58);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.58),
        0 8px 24px rgba(12,87,150,.06);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
    }


    .icon {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,.70), rgba(89,184,255,.22));
      border: 1px solid rgba(255,255,255,.65);
      color: #075da8;
      font-size: 14px;
      font-weight: 800;
      flex: 0 0 32px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }


    .detail-text {
      min-width: 0;
      flex: 1;
    }


    .detail-label {
      font-size: 10px;
      color: #98a2b3;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
    }


    .detail-value {
      margin-top: 2px;
      font-size: 13px;
      color: #344054;
      word-break: break-word;
    }


    .detail-value a {
      color: #344054;
      text-decoration: none;
    }


    .buttons {
      display: grid;
      gap: 9px;
      margin-top: 22px;
    }


    .btn {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }


    .btn-primary {
      background: linear-gradient(135deg, #087fe1, #0756a7);
      color: #fff;
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: 0 12px 28px rgba(0,91,173,.24), inset 0 1px 0 rgba(255,255,255,.35);
    }


    .btn-secondary {
      background: linear-gradient(135deg, rgba(255,255,255,.58), rgba(223,242,255,.30));
      color: #07559d;
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 8px 20px rgba(0,73,137,.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }


    .btn:active {
      transform: scale(.985);
    }


    .footer {
      margin-top: 18px;
      font-size: 10px;
      color: #98a2b3;
      line-height: 1.5;
    }


    .loader {
      position: fixed;
      inset: 0;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition:
        opacity .25s ease,
        visibility .25s ease;
    }


    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }


    .loader-box {
      text-align: center;
    }


    .spinner {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 3px solid #d9dee7;
      border-top-color: #0b1220;
      animation:
        spin .8s linear infinite;
      margin: auto;
    }


    .loader-text {
      margin-top: 13px;
      font-size: 13px;
      font-weight: 700;
      color: #475467;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    .error {
      display: none;
      text-align: center;
      padding: 45px 25px;
    }


    .error.show {
      display: block;
    }


    .error-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }


    .error h2 {
      margin: 0;
      font-size: 21px;
    }


    .error p {
      margin:
        8px 0 20px;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }


    @media (max-width: 520px) {

      body {
        padding: 8px;
        align-items: center;
      }

      .page {
        width: 100%;
        max-width: 460px;
      }

      .card {
        min-height: calc(100dvh - 16px);
        border-radius: 26px;
      }

      .cover {
        height: clamp(105px, 29vw, 135px);
      }

      .content {
        padding-left: clamp(14px, 5vw, 22px);
        padding-right: clamp(14px, 5vw, 22px);
      }

      .badges {
        padding: 0 4px;
      }

      .details {
        gap: 9px;
      }

      .detail {
        padding: 10px;
      }

      .btn {
        min-height: 47px;
      }
    }

    @media (max-width: 360px) {

      body {
        padding: 4px;
      }

      .card {
        min-height: calc(100dvh - 8px);
        border-radius: 22px;
      }

      .name {
        font-size: 22px;
      }

      .detail-value {
        font-size: 12px;
      }
    }

    @media (min-width: 521px) {

      .page {
        width: min(92vw, 460px);
      }
    }

    }
    .cover {

    }

    }

      }

</head>

<body>

  <!-- LOADING -->

  <div
    class="loader"
    id="loader"
  >

<div class="loader-box">

  <div class="spinner"></div>

  <div class="loader-text">
    Loading contact...
  </div>

</div>


  </div>

  <div class="page">


<div
  class="card"
  id="card"
  style="display:none;"
>


  <div class="cover"><img class="brand-logo" src="https://raw.githubusercontent.com/PharmaQA-ops/ggl-main-dashboard/main/logo.png" alt="Gaerish Logistics"></div>


  <div class="content">


    <!-- PHOTO -->

    <div class="photo-wrap">

      <img
        id="photo"
        class="photo"
        alt="Employee photo"
      >

      <div
        id="initials"
        class="initials"
      ></div>

    </div>


    <!-- NAME -->

    <h1
      class="name"
      id="name"
    ></h1>


    <div
      class="designation"
      id="designation"
    ></div>


    <div
      class="department"
      id="department"
    ></div>


    <div
      class="company"
      id="company"
    ></div>

    <div
      class="badges"
      id="badges"
      aria-label="Department badges"
    ></div>


    <div class="divider"></div>


    <!-- DETAILS -->

    <div class="details">


      <div
        class="detail"
        id="mobileRow"
      >

        <div class="icon">
          ☎
        </div>

        <div class="detail-text">

          <div class="detail-label">
            Mobile
          </div>

          <div
            class="detail-value"
            id="mobile"
          ></div>

        </div>

      </div>


      <div
        class="detail"
        id="whatsappRow"
      >

        <div class="icon">
          W
        </div>

        <div class="detail-text">

          <div class="detail-label">
            WhatsApp
          </div>

          <div
            class="detail-value"
            id="whatsapp"
          ></div>

        </div>

      </div>


      <div
        class="detail"
        id="emailRow"
      >

        <div class="icon">
          @
        </div>

        <div class="detail-text">

          <div class="detail-label">
            Email
          </div>

          <div
            class="detail-value"
            id="email"
          ></div>

        </div>

      </div>


      <div
        class="detail"
        id="websiteRow"
      >

        <div class="icon">
          ↗
        </div>

        <div class="detail-text">

          <div class="detail-label">
            Website
          </div>

          <div
            class="detail-value"
            id="website"
          ></div>

        </div>

      </div>


      <div
        class="detail"
        id="linkedinRow"
      >

        <div class="icon">
          in
        </div>

        <div class="detail-text">

          <div class="detail-label">
            LinkedIn
          </div>

          <div
            class="detail-value"
            id="linkedin"
          ></div>

        </div>

      </div>


      <div
        class="detail"
        id="addressRow"
      >

        <div class="icon">
          ⌖
        </div>

        <div class="detail-text">

          <div class="detail-label">
            Office
          </div>

          <div
            class="detail-value"
            id="address"
          ></div>

        </div>

      </div>


    </div>


    <!-- ACTIONS -->

    <div class="buttons">


      <button
        class="btn btn-primary"
        onclick="addToContacts()"
      >
        Add to Contacts
      </button>


      <button
        class="btn btn-secondary"
        onclick="shareCard()"
      >
        Share Contact
      </button>


      <button
        class="btn btn-secondary"
        onclick="copyCardLink()"
      >
        Copy Contact Link
      </button>


    </div>


    <div class="footer">

      Digital Business Card ·
      Gaerish Logistics Pvt Ltd

    </div>


  </div>

</div>


<!-- ERROR -->

<div
  class="card"
  id="errorCard"
  style="display:none;"
>

  <div class="error show">

    <div class="error-icon">
      ⚠
    </div>

    <h2>
      Contact unavailable
    </h2>

    <p id="errorMessage">
      The requested employee contact
      could not be found.
    </p>

  </div>

</div>

  <script>


    /*
     * IMPORTANT
     *
     * This must be your deployed
     * Apps Script Web App URL.
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbyOnaQEYIqjIqdAeBY8KNk0brPmJ4IvBA5pPHfvdDhP18zFknmOwmPw8R-9PG8hS7lLIg/exec';


    let employee =
      null;


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      loadContact
    );


    /* =====================================================
       LOAD CONTACT
       ===================================================== */

    function loadContact() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const employeeId =
        (
          params.get('employee') ||
          params.get('id') ||
          ''
        )
        .trim()
        .toUpperCase();


      if (!employeeId) {

        showError(
          'Employee ID is missing from the contact link.'
        );

        return;

      }


      const callbackName =
        'gglContactCallback_' +
        Date.now();


      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success ||
              !response.employee
            ) {

              showError(
                getApiError(
                  response
                )
              );

              return;

            }


            employee =
              response.employee;


            renderContact(
              employee
            );

          }

          catch (error) {

            showError(
              error.message
            );

          }

          finally {

            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        API_URL +
        '?action=contact' +
        '&employee=' +
        encodeURIComponent(
          employeeId
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +
        '&v=' +
        Date.now();


      script.onerror =
        function() {

          showError(
            'Unable to connect to the contact service.'
          );

          cleanupJsonp(
            script,
            callbackName
          );

        };


      document.body.appendChild(
        script
      );

    }


    function cleanupJsonp(
      script,
      callbackName
    ) {

      if (script) {

        script.remove();

      }


      try {

        delete window[
          callbackName
        ];

      }

      catch (error) {

        window[
          callbackName
        ] = undefined;

      }

    }


    /* =====================================================
       RENDER
       ===================================================== */

    function renderContact(
      data
    ) {

      setText(
        'name',
        data.name
      );

      setText(
        'designation',
        data.designation
      );

      setText(
        'department',

      );

      setText(
        'company',

      );

      renderBadges(data);


      renderPhoto(

        data.name
      );


      renderMobile(

      );


      renderWhatsApp(
        data.whatsapp
      );


      renderEmail(
        data.email
      );


      renderWebsite(
        data.website
      );


      renderLinkedIn(
        data.linkedin
      );


      renderAddress(
        data.address
      );


      document.getElementById(
        'card'
      ).style.display =
        'block';


      document.getElementById(
        'loader'
      )
      .classList
      .add('hidden');

    }



    /* =====================================================
       BADGES
       ===================================================== */

    function renderBadges(data) {

      const container =
        document.getElementById('badges');

      if (!container) {
        return;
      }

      const badges = getDepartmentBadges(data);

      container.innerHTML = badges
        .map(function(badge) {
          return (
            '<span class="badge ' +
            badge.className +
            '">' +
            escapeHtml(badge.label) +
            '</span>'
          );
        })
        .join('');

      container.style.display =
        badges.length ? 'flex' : 'none';
    }


    function getDepartmentBadges(data) {

      const department =
        String(data.department || '').trim();

      const designation =
        String(data.designation || '').trim();

      const combined =
        (department + ' ' + designation).toLowerCase();

      const result = [];

      /*
       * Special department badges.
       * One badge is shown for each matching specialty.
       */
      const rules = [
        {
          keys: ['dg', 'dangerous goods', 'dgr', 'imdg'],
          label: 'DG',
          className: 'badge-dg'
        },
        {
          keys: ['pharma', 'pharmaceutical', 'pharmaceuticals'],
          label: 'PHARMA',
          className: 'badge-pharma'
        },
        {
          keys: ['project', 'projects', 'pm', 'transformation'],
          label: 'PROJECTS',
          className: 'badge-projects'
        },
        {
          keys: ['qa', 'quality', 'quality assurance', 'qms'],
          label: 'QA',
          className: 'badge-qa'
        },
        {
          keys: ['operation', 'operations', 'export', 'import', 'logistics'],
          label: 'OPERATIONS',
          className: 'badge-operations'
        },
        {
          keys: ['sales', 'business development', 'bd', 'marketing'],
          label: 'SALES',
          className: 'badge-sales'
        },
        {
          keys: ['finance', 'accounts', 'accounting'],
          label: 'FINANCE',
          className: 'badge-finance'
        },
        {
          keys: ['hr', 'human resource', 'human resources'],
          label: 'HR',
          className: 'badge-hr'
        },
        {
          keys: ['it', 'information technology', 'technology'],
          label: 'IT',
          className: 'badge-it'
        },
        {
          keys: ['management', 'admin', 'administration'],
          label: 'MANAGEMENT',
          className: 'badge-management'
        }
      ];

      rules.forEach(function(rule) {

        const matched =
          rule.keys.some(function(key) {
            return combined.indexOf(key) !== -1;
          });

        if (matched) {
          result.push({
            label: rule.label,
            className: rule.className
          });
        }
      });

      /*
       * If the department does not match a predefined specialty,
       * show the actual department as a neutral badge.
       */
      if (!result.length && department) {
        result.push({
          label: department,
          className: 'badge-default'
        });
      }

      /*
       * If QA is the designation and the department is another
       * specialty, QA is also useful as a second badge.
       */
      if (
        /\bqa\b|quality assurance/i.test(designation) &&
        !result.some(function(item) {
          return item.label === 'QA';
        })
      ) {
        result.push({
          label: 'QA',
          className: 'badge-qa'
        });
      }

      return result;
    }

    /* =====================================================
       PHOTO
       ===================================================== */

    function renderPhoto(
      photoUrl,
      name
    ) {

      const photo =
        document.getElementById(
          'photo'
        );

      const initials =
        document.getElementById(
          'initials'
        );

      const raw =
        String(
          photoUrl || ''
        ).trim();

      if (!raw) {
        showInitials(name);
        return;
      }

      /*
       * Try several Google Drive delivery formats.
       * This is important because a Drive "view" URL can work
       * on desktop but fail as an <img> source on some mobiles.
       */
      const candidates =
        buildPhotoCandidates(raw);

      let index = 0;

      photo.style.display = 'block';
      initials.style.display = 'none';

      photo.onload =
        function() {
          photo.style.display = 'block';
          initials.style.display = 'none';
        };

      photo.onerror =
        function() {
          index++;

          if (index < candidates.length) {
            photo.src = candidates[index];
          } else {
            showInitials(name);
          }
        };

      photo.src = candidates[0];
    }


    function buildPhotoCandidates(value) {

      const url =
        String(value || '').trim();

      if (!url) {
        return [];
      }

      const candidates = [];

      const driveMatch =
        url.match(
          /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^#]*id=)([A-Za-z0-9_-]+)/
        );

      if (driveMatch) {

        const id = driveMatch[1];

        candidates.push(
          'https://drive.google.com/thumbnail?id=' +
          encodeURIComponent(id) +
          '&sz=w1000'
        );

        candidates.push(
          'https://drive.google.com/uc?export=view&id=' +
          encodeURIComponent(id)
        );

        candidates.push(
          'https://drive.google.com/uc?export=download&id=' +
          encodeURIComponent(id)
        );
      }

      candidates.push(url);

      return [...new Set(candidates)];
    }


    function normalizePhotoUrl(
      value
    ) {

      const url =
        String(
          value || ''
        ).trim();

      if (!url) {
        return '';
      }

      /*
       * Accept a normal image URL or a
       * Google Drive file URL.
       */
      const driveMatch =
        url.match(
          /drive\.google\.com\/file\/d\/([^/]+)/
        );

      if (driveMatch) {

        return (
          'https://drive.google.com/uc?export=view&id=' +
          encodeURIComponent(
            driveMatch[1]
          )
        );

      }

      return url;

    }


    function getPhotoCandidates(value) {
      const url = String(value || '').trim();
      if (!url) return [];

      const candidates = [];
      const driveMatch = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([^/&?]+)/);

      if (driveMatch) {
        const id = driveMatch[1];
        candidates.push(
          'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1000'
        );
        candidates.push(
          'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(id)
        );
      }

      candidates.push(url);

      return [...new Set(candidates)];
    }


    function showInitials(

      const photo =

    /* =====================================================
       ADD TO CONTACTS
       ===================================================== */

    async function addToContacts() {

      if (!employee) {
        return;
      }

      const vcard = createVCard(employee);

      const safeName =
        String(
          employee.name ||
          employee.employeeId ||
          'contact'
        )
        .replace(/[^a-z0-9 _-]/gi, '')
        .trim() || 'contact';

      const fileName = safeName + '.vcf';

      const blob = new Blob(
        [vcard],
        {
          type: 'text/vcard;charset=utf-8'
        }
      );

      /*
       * MOBILE-FIRST:
       * Try the native phone share sheet with the VCF attached.
       * This avoids the old contact-service dependency completely.
       */
      try {

        const file = new File(
          [blob],
          fileName,
          {
            type: 'text/vcard'
          }
        );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          await navigator.share({
            title:
              employee.name ||
              'Gaerish Logistics Contact',

            text:
              'Save this contact to your phone.',

            files: [file]
          });

          return;
        }

      } catch (error) {

        /*
         * AbortError means the user closed/cancelled
         * the native share sheet. Do not show an error.
         */
        if (
          error &&
          error.name === 'AbortError'
        ) {
          return;
        }

      }

      /*
       * FALLBACK:
       * Generate the VCF locally and download it.
       * No Apps Script contact service is required.
       */
      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement('a');

      link.href = url;
      link.download = fileName;
      link.style.display = 'none';

      document.body.appendChild(link);

      link.click();

      link.remove();

      setTimeout(
        function() {
          URL.revokeObjectURL(url);
        },
        3000
      );

    }


    /* =====================================================
       VCARD GENERATOR
       ===================================================== */

    function createVCard(
      data
    ) {

      let vcard =
        'BEGIN:VCARD\r\n';

      vcard +=
        'VERSION:3.0\r\n';

      vcard +=
        'FN:' +
        vcardEscape(
          data.name
        ) +
        '\r\n';

      vcard +=
        'N:' +
        vcardEscape(
          data.name
        ) +
        ';;;;\r\n';


      if (data.company) {

        vcard +=
          'ORG:' +
          vcardEscape(
            data.company
          ) +
          '\r\n';

      }


      if (data.designation) {

        vcard +=
          'TITLE:' +
          vcardEscape(
            data.designation
          ) +
          '\r\n';

      }


      if (data.department) {

        vcard +=
          'ROLE:' +
          vcardEscape(
            data.department
          ) +
          '\r\n';

      }


      if (data.mobile) {

        vcard +=
          'TEL;TYPE=CELL:' +
          vcardEscape(
            data.mobile
          ) +
          '\r\n';

      }


      if (
        data.whatsapp &&
        data.whatsapp !==
          data.mobile
      ) {

        vcard +=
          'TEL;TYPE=WORK:' +
          vcardEscape(
            data.whatsapp
          ) +
          '\r\n';

      }


      if (data.email) {

        vcard +=
          'EMAIL;TYPE=WORK:' +
          vcardEscape(
            data.email
          ) +
          '\r\n';

      }


      if (data.website) {

        vcard +=
          'URL:' +
          vcardEscape(
            normalizeUrl(
              data.website
            )
          ) +
          '\r\n';

      }


      if (data.linkedin) {

        vcard +=
          'X-SOCIALPROFILE;TYPE=linkedin:' +
          vcardEscape(
            normalizeUrl(
              data.linkedin
            )
          ) +
          '\r\n';

      }


      if (data.address) {

        vcard +=
          'ADR;TYPE=WORK:;;' +
          vcardEscape(
            data.address
          ) +
          ';;;;\r\n';

      }


      if (data.employeeId) {

        vcard +=
          'NOTE:GGL Employee ID - ' +
          vcardEscape(
            data.employeeId
          ) +
          '\r\n';

      }


      vcard +=
        'END:VCARD';


      return vcard;

    }


    function vcardEscape(
      value
    ) {

      return String(
        value || ''
      )

      .replace(
        /\\/g,
        '\\\\'
      )

      .replace(
        /\r?\n/g,
        '\\n'
      )

      .replace(
        /;/g,
        '\\;'
      )

      .replace(
        /,/g,
        '\\,'
      );

    }


    /* =====================================================
       SHARE
       ===================================================== */

    async function shareCard() {

      const url =
        window.location.href;


      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              employee
                ? employee.name
                : 'GGL Contact',

            text:
              employee
                ? employee.name +
                  ' — ' +
                  (
                    employee.designation ||
                    'Gaerish Logistics'
                  )
                : 'Gaerish Logistics contact',

            url:
              url

          });

          return;

        }

        catch (error) {

          /*
           * User cancelled share.
           */

        }

      }


      copyText(
        url,
        'Contact link copied.'
      );

    }


    /* =====================================================
       COPY
       ===================================================== */

    function copyCardLink() {

      copyText(
        window.location.href,
        'Contact link copied.'
      );

    }


    async function copyText(
      text,
      successMessage
    ) {

      try {

        if (
          navigator.clipboard &&
          navigator.clipboard.writeText
        ) {

          await navigator.clipboard.writeText(
            text
          );

        }

        else {

          const input =
            document.createElement(
              'textarea'
            );

          input.value =
            text;

          input.style.position =
            'fixed';

          input.style.opacity =
            '0';

          document.body.appendChild(
            input
          );

          input.select();

          document.execCommand(
            'copy'
          );

          input.remove();

        }


        alert(
          successMessage
        );

      }

      catch (error) {

        alert(
          'Unable to copy the contact link.'
        );

      }

    }


    /* =====================================================
       ERROR
       ===================================================== */

    function showError(
      message
    ) {

      document.getElementById(
        'loader'
      )
      .classList
      .add('hidden');


      document.getElementById(
        'card'
      ).style.display =
        'none';


      document.getElementById(
        'errorCard'
      ).style.display =
        'block';


      document.getElementById(
        'errorMessage'
      ).textContent =
        message ||
        'The requested employee contact could not be found.';

    }


    function getApiError(
      response
    ) {

      if (!response) {

        return 'No response received from the contact service.';

      }


      switch (
        response.error
      ) {

        case 'EMPLOYEE_ID_REQUIRED':

          return 'Employee ID is missing.';

        case 'EMPLOYEE_NOT_FOUND':

          return 'Employee contact was not found.';

        case 'CONTACT_UNAVAILABLE':

          return 'This employee contact is currently unavailable.';

        case 'INVALID_CALLBACK':

          return 'Invalid contact request.';

        default:

          return (
            response.error ||
            'Contact unavailable.'
          );

      }

    }


    /* =====================================================
       GENERAL HELPERS
       ===================================================== */

    function setText(
      id,
      value
    ) {

      document.getElementById(
        id
      ).textContent =
        value || '';

    }


    function getInitials(
      name
    ) {

      const parts =
        String(
          name || ''
        )
        .trim()
        .split(/\s+/)
        .filter(Boolean);


      if (!parts.length) {

        return 'G';

      }


      if (
        parts.length === 1
      ) {

        return parts[0]
          .substring(0,2)
          .toUpperCase();

      }


      return (
        parts[0][0] +
        parts[
          parts.length - 1
        ][0]
      ).toUpperCase();

    }


    function normalizeUrl(
      value
    ) {

      const text =
        String(
          value || ''
        ).trim();


      if (!text) {

        return '';

      }


      if (
        /^https?:\/\//i.test(
          text
        )
      ) {

        return text;

      }


      return 'https://' + text;

    }


    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ''
          : value
      )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

    }


    function escapeAttr(
      value
    ) {

      return escapeHtml(
        value
      );

    }


  </script>
