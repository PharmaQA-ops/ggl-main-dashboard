<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"

>

<meta
name="theme-color"
content="#0b1220"

>

  <title>
    Gaerish Logistics — Digital Contact
  </title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        linear-gradient(
          145deg,
          #eef2f7,
          #dfe6ef
        );
      color: #101828;
    }


    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }


    .page {
      width: 100%;
      max-width: 430px;
    }


    .card {
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      box-shadow:
        0 25px 70px rgba(15,23,42,.16);
    }


    .cover {
      height: 125px;
      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(255,255,255,.20),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #0b1220,
          #1d2939
        );
    }


    .content {
      padding: 0 25px 25px;
      text-align: center;
    }


    .photo-wrap {
      width: 124px;
      height: 124px;
      margin:
        -62px auto 15px;
      position: relative;
    }


    .photo {
      width: 124px;
      height: 124px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #fff;
      background: #e5e7eb;
      box-shadow:
        0 8px 30px rgba(15,23,42,.18);
      display: block;
    }


    .initials {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: #0b1220;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      box-shadow:
        0 8px 30px rgba(15,23,42,.18);
    }


    .name {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.4px;
    }


    .designation {
      margin-top: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #475467;
    }


    .department {
      margin-top: 3px;
      font-size: 12px;
      color: #667085;
    }


    .company {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }


    .divider {
      height: 1px;
      background: #eaecf0;
      margin: 21px 0;
    }


    .details {
      text-align: left;
      display: grid;
      gap: 11px;
    }


    .detail {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 13px;
      background: #f8fafc;
    }


    .icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9eef5;
      color: #172033;
      font-size: 14px;
      flex: 0 0 30px;
    }


    .detail-text {
      min-width: 0;
      flex: 1;
    }


    .detail-label {
      font-size: 10px;
      color: #98a2b3;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
    }


    .detail-value {
      margin-top: 2px;
      font-size: 13px;
      color: #344054;
      word-break: break-word;
    }


    .detail-value a {
      color: #344054;
      text-decoration: none;
    }


    .buttons {
      display: grid;
      gap: 9px;
      margin-top: 22px;
    }


    .btn {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }


    .btn-primary {
      background: #0b1220;
      color: #fff;
    }


    .btn-secondary {
      background: #eef2f6;
      color: #172033;
    }


    .btn:active {
      transform: scale(.985);
    }


    .footer {
      margin-top: 18px;
      font-size: 10px;
      color: #98a2b3;
      line-height: 1.5;
    }


    .loader {
      position: fixed;
      inset: 0;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition:
        opacity .25s ease,
        visibility .25s ease;
    }


    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }


    .loader-box {
      text-align: center;
    }


    .spinner {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 3px solid #d9dee7;
      border-top-color: #0b1220;
      animation:
        spin .8s linear infinite;
      margin: auto;
    }


    .loader-text {
      margin-top: 13px;
      font-size: 13px;
      font-weight: 700;
      color: #475467;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    .error {
      display: none;
      text-align: center;
      padding: 45px 25px;
    }


    .error.show {
      display: block;
    }


    .error-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }


    .error h2 {
      margin: 0;
      font-size: 21px;
    }


    .error p {
      margin:
        8px 0 20px;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }


    @media(max-width:420px) {

      body {
        padding: 0;
        align-items: stretch;
      }

      .page {
        max-width: none;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
      }

      .cover {
        height: 115px;
      }

      .content {
        padding-left: 20px;
        padding-right: 20px;
      }

    }

  
    /* === GGL BLUE LIQUID GLASS THEME === */
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(79,158,255,.38), transparent 34%),
        radial-gradient(circle at 90% 20%, rgba(0,198,255,.28), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(38,91,255,.24), transparent 38%),
        linear-gradient(135deg,#eaf4ff 0%,#cfe5ff 45%,#edf7ff 100%);

    }
    body::before {
      content:"";
      position:fixed; inset:-20%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 24%),
        radial-gradient(circle at 70% 65%, rgba(70,150,255,.18), transparent 28%);
      filter:blur(45px);
      pointer-events:none;
      z-index:-1;
    }
    .page { position:relative; z-index:1; }
    .card {
      background:linear-gradient(135deg,rgba(255,255,255,.68),rgba(255,255,255,.38));
      border:1px solid rgba(255,255,255,.75);
      box-shadow:0 28px 80px rgba(20,78,150,.22), inset 0 1px 0 rgba(255,255,255,.8);
      backdrop-filter:blur(24px) saturate(150%);
      -webkit-backdrop-filter:blur(24px) saturate(150%);
    }
    .cover {
      height:150px;
      background:
        radial-gradient(circle at 15% 25%,rgba(255,255,255,.42),transparent 24%),
        radial-gradient(circle at 85% 70%,rgba(120,210,255,.30),transparent 30%),
        linear-gradient(135deg,#0757d9,#0b8cff 48%,#21c4ff);
      position:relative;
    }
    .cover::after {
      content:"";
      position:absolute; inset:0;
      background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.24) 45%,transparent 70%);
      transform:translateX(-100%);
      animation:glassSweep 5s ease-in-out infinite;
    }
    @keyframes glassSweep { 50%,100%{transform:translateX(100%)} }
    .brand-logo {
      position:absolute; top:18px; left:20px; height:42px; width:auto;
      max-width:210px; object-fit:contain; object-position:left center;
      filter:drop-shadow(0 5px 12px rgba(0,30,100,.22));
      z-index:2;
    }
    .content { padding:0 25px 25px; }
    .photo {
      border-color:rgba(255,255,255,.92);
      box-shadow:0 10px 34px rgba(12,75,155,.24);
    }
    .initials {
      border-color:rgba(255,255,255,.92);
      background:linear-gradient(135deg,#0757d9,#13a9ff);
    }
    .name { color:#09244a; }
    .designation { color:#1760a9; }
    .department { color:#4b6d91; }
    .company { color:#164b7c; }
    .divider { background:rgba(39,103,170,.14); }
    .detail {
      background:linear-gradient(135deg,rgba(255,255,255,.56),rgba(232,244,255,.42));
      border:1px solid rgba(255,255,255,.68);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .icon {
      background:linear-gradient(135deg,rgba(44,130,235,.16),rgba(0,183,255,.12));
      color:#0757d9;
      border:1px solid rgba(255,255,255,.7);
    }
    .detail-label { color:#5f86ad; }
    .detail-value, .detail-value a { color:#173e67; }
    .btn {
      border:1px solid rgba(255,255,255,.65);
      box-shadow:0 8px 22px rgba(18,92,170,.12),inset 0 1px 0 rgba(255,255,255,.55);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .btn-primary {
      background:linear-gradient(135deg,#0757d9,#0b8cff 55%,#16b9ff);
      color:#fff;
      box-shadow:0 10px 28px rgba(8,91,220,.30),inset 0 1px 0 rgba(255,255,255,.35);
    }
    .btn-secondary {
      background:rgba(255,255,255,.48);
      color:#0b3f76;
    }
    .btn-secondary:hover { background:rgba(255,255,255,.68); }
    .loader { background:linear-gradient(135deg,#eaf4ff,#d5eaff); }
    .spinner { border-color:#c7dcf5; border-top-color:#0757d9; }
    .loader-text { color:#24547f; }
    .footer { color:#6689aa; }
    @media(max-width:420px) {
      .cover { height:125px; }
      .brand-logo { top:16px; left:18px; height:36px; max-width:185px; }
      .content { padding-left:18px; padding-right:18px; }
    }

  </style>

</head>

<!-- ERROR -->

<div

  id="errorCard"

>

  <div class="error show">

    </h2>

  </div>

  <script>


    /*
     * IMPORTANT
     *
     * This must be your deployed
     * Apps Script Web App URL.
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbyOnaQEYIqjIqdAeBY8KNk0brPmJ4IvBA5pPHfvdDhP18zFknmOwmPw8R-9PG8hS7lLIg/exec';


    let employee =
      null;


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
      'DOMContentLoaded',
      loadContact
    );


    /* =====================================================
       LOAD CONTACT
       ===================================================== */

    function loadContact() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const employeeId =
        (
          params.get('employee') ||
          params.get('id') ||
          ''
        )
        .trim()
        .toUpperCase();


      if (!employeeId) {

        showError(
          'Employee ID is missing from the contact link.'
        );

        return;

      }


      const callbackName =
        'gglContactCallback_' +
        Date.now();


      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success ||
              !response.employee
            ) {

              showError(
                getApiError(
                  response
                )
              );

              return;

            }


            employee =
              response.employee;


            renderContact(
              employee
            );

          }

          catch (error) {

            showError(
              error.message
            );

          }

          finally {

            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        API_URL +
        '?action=contact' +
        '&employee=' +
        encodeURIComponent(
          employeeId
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +
        '&v=1';


      script.onerror =
        function() {

          showError(
            'Unable to connect to the contact service.'
          );

          cleanupJsonp(
            script,
            callbackName
          );

        };


      document.body.appendChild(
        script
      );

    }


    function cleanupJsonp(
      script,
      callbackName
    ) {

      if (script) {

        script.remove();

      }


      try {

        delete window[
          callbackName
        ];

      }

      catch (error) {

        window[
          callbackName
        ] = undefined;

      }

    }


    /* =====================================================
       RENDER
       ===================================================== */

    function renderContact(
      data
    ) {

      setText(
        'name',
        data.name
      );

      setText(
        'designation',
        data.designation
      );

      setText(
        'department',
        data.department
      );

      setText(
        'company',
        data.company
      );


      renderPhoto(
        data.photo,
        data.name
      );


      renderMobile(
        data.mobile
      );


      renderWhatsApp(
        data.whatsapp
      );


      renderEmail(
        data.email
      );


      renderWebsite(
        data.website
      );


      renderLinkedIn(
        data.linkedin
      );


      renderAddress(
        data.address
      );


      document.getElementById(
        'card'
      ).style.display =
        'block';


      document.getElementById(
        'loader'
      )
      .classList
      .add('hidden');

    }


    /* =====================================================
       PHOTO
       ===================================================== */

    function renderPhoto(
      photoUrl,
      name
    ) {

      const photo =
        document.getElementById(
          'photo'
        );

      const initials =
        document.getElementById(
          'initials'
        );


      if (!photoUrl) {

        showInitials(
          name
        );

        return;

      }


      photo.onload =
        function() {

          photo.style.display =
            'block';

          initials.style.display =
            'none';

        };


      photo.onerror =
        function() {

          showInitials(
            name
          );

        };


      photo.src =
        normalizePhotoUrl(
          photoUrl
        );

    }


    function normalizePhotoUrl(
      value
    ) {

      const url =
        String(
          value || ''
        ).trim();

      if (!url) {
        return '';
      }

      /*
       * Accept a normal image URL or a
       * Google Drive file URL.
       */
      const driveMatch =
        url.match(
          /drive\.google\.com\/file\/d\/([^/]+)/
        );

      if (driveMatch) {

        return (
          'https://drive.google.com/uc?export=view&id=' +
          encodeURIComponent(
            driveMatch[1]
          )
        );

      }

      return url;

    }


    function showInitials(
      name
    ) {

      const photo =
        document.getElementById(
          'photo'
        );

      const initials =
        document.getElementById(
          'initials'
        );


      photo.style.display =
        'none';


      initials.textContent =
        getInitials(
          name
        );


      initials.style.display =
        'flex';

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    function renderMobile(
      value
    ) {

      const row =
        document.getElementById(
          'mobileRow'
        );

      const target =
        document.getElementById(
          'mobile'
        );


      if (!value) {

        row.style.display =
          'none';

        return;

      }


      row.style.display =
        'flex';


      target.innerHTML =
        '<a href="tel:' +
        escapeAttr(
          value
        ) +
        '">' +
        escapeHtml(
          value
        ) +
        '</a>';

    }


    /* =====================================================
       WHATSAPP
       ===================================================== */

    function renderWhatsApp(
      value
    ) {

      const row =
        document.getElementById(
          'whatsappRow'
        );

      const target =
        document.getElementById(
          'whatsapp'
        );


      if (!value) {

        row.style.display =
          'none';

        return;

      }


      const number =
        value.replace(
          /[^\d+]/g,
          ''
        );


      row.style.display =
        'flex';


      target.innerHTML =
        '<a href="https://wa.me/' +
        encodeURIComponent(
          number.replace(
            /^\+/,
            ''
          )
        ) +
        '" target="_blank" rel="noopener">' +
        escapeHtml(
          value
        ) +
        '</a>';

    }


    /* =====================================================
       EMAIL
       ===================================================== */

    function renderEmail(
      value
    ) {

      const row =
        document.getElementById(
          'emailRow'
        );

      const target =
        document.getElementById(
          'email'
        );


      if (!value) {

        row.style.display =
          'none';

        return;

      }


      row.style.display =
        'flex';


      target.innerHTML =
        '<a href="mailto:' +
        escapeAttr(
          value
        ) +
        '">' +
        escapeHtml(
          value
        ) +
        '</a>';

    }


    /* =====================================================
       WEBSITE
       ===================================================== */

    function renderWebsite(
      value
    ) {

      const row =
        document.getElementById(
          'websiteRow'
        );

      const target =
        document.getElementById(
          'website'
        );


      if (!value) {

        row.style.display =
          'none';

        return;

      }


      row.style.display =
        'flex';


      const url =
        normalizeUrl(
          value
        );


      target.innerHTML =
        '<a href="' +
        escapeAttr(
          url
        ) +
        '" target="_blank" rel="noopener">' +
        escapeHtml(
          value
        ) +
        '</a>';

    }


    /* =====================================================
       LINKEDIN
       ===================================================== */

    function renderLinkedIn(
      value
    ) {

      const row =
        document.getElementById(
          'linkedinRow'
        );

      const target =
        document.getElementById(
          'linkedin'
        );


      if (!value) {

        row.style.display =
          'none';

        return;

      }


      row.style.display =
        'flex';


      const url =
        normalizeUrl(
          value
        );


      target.innerHTML =
        '<a href="' +
        escapeAttr(
          url
        ) +
        '" target="_blank" rel="noopener">' +
        escapeHtml(
          value
        ) +
        '</a>';

    }


    /* =====================================================
       ADDRESS
       ===================================================== */

    function renderAddress(
      value
    ) {

      const row =
        document.getElementById(
          'addressRow'
        );

      const target =
        document.getElementById(
          'address'
        );


      if (!value) {

        row.style.display =
          'none';

        return;

      }


      row.style.display =
        'flex';


      target.textContent =
        value;

    }


    /* =====================================================
       ADD TO CONTACTS
       ===================================================== */

    async function addToContacts() {

      if (!employee) {
        return;
      }

      const vcard = createVCard(employee);

      const safeName =
        String(
          employee.name ||
          employee.employeeId ||
          'contact'
        )
        .replace(/[^a-z0-9 _-]/gi, '')
        .trim() || 'contact';

      const fileName = safeName + '.vcf';

      const blob = new Blob(
        [vcard],
        {
          type: 'text/vcard;charset=utf-8'
        }
      );

      /*
       * MOBILE-FIRST:
       * Try the native phone share sheet with the VCF attached.
       * This avoids the old contact-service dependency completely.
       */
      try {

        const file = new File(
          [blob],
          fileName,
          {
            type: 'text/vcard'
          }
        );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          await navigator.share({
            title:
              employee.name ||
              'Gaerish Logistics Contact',

            text:
              'Save this contact to your phone.',

            files: [file]
          });

          return;
        }

      } catch (error) {

        /*
         * AbortError means the user closed/cancelled
         * the native share sheet. Do not show an error.
         */
        if (
          error &&
          error.name === 'AbortError'
        ) {
          return;
        }

      }

      /*
       * FALLBACK:
       * Generate the VCF locally and download it.
       * No Apps Script contact service is required.
       */
      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement('a');

      link.href = url;
      link.download = fileName;
      link.style.display = 'none';

      document.body.appendChild(link);

      link.click();

      link.remove();

      setTimeout(
        function() {
          URL.revokeObjectURL(url);
        },
        3000
      );

    }


    /* =====================================================
       VCARD GENERATOR
       ===================================================== */

    function createVCard(
      data
    ) {

      let vcard =
        'BEGIN:VCARD\r\n';

      vcard +=
        'VERSION:3.0\r\n';

      vcard +=
        'FN:' +
        vcardEscape(
          data.name
        ) +
        '\r\n';

      vcard +=
        'N:' +
        vcardEscape(
          data.name
        ) +
        ';;;;\r\n';


      if (data.company) {

        vcard +=
          'ORG:' +
          vcardEscape(
            data.company
          ) +
          '\r\n';

      }


      if (data.designation) {

        vcard +=
          'TITLE:' +
          vcardEscape(
            data.designation
          ) +
          '\r\n';

      }


      if (data.department) {

        vcard +=
          'ROLE:' +
          vcardEscape(
            data.department
          ) +
          '\r\n';

      }


      if (data.mobile) {

        vcard +=
          'TEL;TYPE=CELL:' +
          vcardEscape(
            data.mobile
          ) +
          '\r\n';

      }


      if (
        data.whatsapp &&
        data.whatsapp !==
          data.mobile
      ) {

        vcard +=
          'TEL;TYPE=WORK:' +
          vcardEscape(
            data.whatsapp
          ) +
          '\r\n';

      }


      if (data.email) {

        vcard +=
          'EMAIL;TYPE=WORK:' +
          vcardEscape(
            data.email
          ) +
          '\r\n';

      }


      if (data.website) {

        vcard +=
          'URL:' +
          vcardEscape(
            normalizeUrl(
              data.website
            )
          ) +
          '\r\n';

      }


      if (data.linkedin) {

        vcard +=
          'X-SOCIALPROFILE;TYPE=linkedin:' +
          vcardEscape(
            normalizeUrl(
              data.linkedin
            )
          ) +
          '\r\n';

      }


      if (data.address) {

        vcard +=
          'ADR;TYPE=WORK:;;' +
          vcardEscape(
            data.address
          ) +
          ';;;;\r\n';

      }


      if (data.employeeId) {

        vcard +=
          'NOTE:GGL Employee ID - ' +
          vcardEscape(
            data.employeeId
          ) +
          '\r\n';

      }


      vcard +=
        'END:VCARD';


      return vcard;

    }


    function vcardEscape(
      value
    ) {

      return String(
        value || ''
      )

      .replace(
        /\\/g,
        '\\\\'
      )

      .replace(
        /\r?\n/g,
        '\\n'
      )

      .replace(
        /;/g,
        '\\;'
      )

      .replace(
        /,/g,
        '\\,'
      );

    }


    /* =====================================================
       SHARE
       ===================================================== */

    async function shareCard() {

      const url =
        window.location.href;


      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              employee
                ? employee.name
                : 'GGL Contact',

            text:
              employee
                ? employee.name +
                  ' — ' +
                  (
                    employee.designation ||
                    'Gaerish Logistics'
                  )
                : 'Gaerish Logistics contact',

            url:
              url

          });

          return;

        }

        catch (error) {

          /*
           * User cancelled share.
           */

        }

      }


      copyText(
        url,
        'Contact link copied.'
      );

    }


    /* =====================================================
       COPY
       ===================================================== */

    function copyCardLink() {

      copyText(
        window.location.href,
        'Contact link copied.'
      );

    }


    async function copyText(
      text,
      successMessage
    ) {

      try {

        if (
          navigator.clipboard &&
          navigator.clipboard.writeText
        ) {

          await navigator.clipboard.writeText(
            text
          );

        }

        else {

          const input =
            document.createElement(
              'textarea'
            );

          input.value =
            text;

          input.style.position =
            'fixed';

          input.style.opacity =
            '0';

          document.body.appendChild(
            input
          );

          input.select();

          document.execCommand(
            'copy'
          );

          input.remove();

        }


        alert(
          successMessage
        );

      }

      catch (error) {

        alert(
          'Unable to copy the contact link.'
        );

      }

    }


    /* =====================================================
       ERROR
       ===================================================== */

    function showError(
      message
    ) {

      document.getElementById(
        'loader'
      )
      .classList
      .add('hidden');


      document.getElementById(
        'card'
      ).style.display =
        'none';


      document.getElementById(
        'errorCard'
      ).style.display =
        'block';


      document.getElementById(
        'errorMessage'
      ).textContent =
        message ||
        'The requested employee contact could not be found.';

    }


    function getApiError(
      response
    ) {

      if (!response) {

        return 'No response received from the contact service.';

      }


      switch (
        response.error
      ) {

        case 'EMPLOYEE_ID_REQUIRED':

          return 'Employee ID is missing.';

        case 'EMPLOYEE_NOT_FOUND':

          return 'Employee contact was not found.';

        case 'CONTACT_UNAVAILABLE':

          return 'This employee contact is currently unavailable.';

        case 'INVALID_CALLBACK':

          return 'Invalid contact request.';

        default:

          return (
            response.error ||
            'Contact unavailable.'
          );

      }

    }


    /* =====================================================
       GENERAL HELPERS
       ===================================================== */

    function setText(
      id,
      value
    ) {

      document.getElementById(
        id
      ).textContent =
        value || '';

    }


    function getInitials(
      name
    ) {

      const parts =
        String(
          name || ''
        )
        .trim()
        .split(/\s+/)
        .filter(Boolean);


      if (!parts.length) {

        return 'G';

      }


      if (
        parts.length === 1
      ) {

        return parts[0]
          .substring(0,2)
          .toUpperCase();

      }


      return (
        parts[0][0] +
        parts[
          parts.length - 1
        ][0]
      ).toUpperCase();

    }


    function normalizeUrl(
      value
    ) {

      const text =
        String(
          value || ''
        ).trim();


      if (!text) {

        return '';

      }


      if (
        /^https?:\/\//i.test(
          text
        )
      ) {

        return text;

      }


      return 'https://' + text;

    }


    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ''
          : value
      )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

    }


    function escapeAttr(
      value
    ) {

      return escapeHtml(
        value
      );

    }


  </script>
