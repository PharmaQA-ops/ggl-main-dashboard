<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"

>

<meta
name="theme-color"
content="#0b1220"

>

  <title>
    Gaerish Logistics — Digital Contact
  </title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(86,190,255,.34), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(16,105,207,.30), transparent 34%),
        linear-gradient(145deg, #d9efff 0%, #eef8ff 45%, #c8e6fb 100%);
      background-attachment: fixed;
      color: #101828;
    }


    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(8px, 2.5vw, 24px);
      overflow-x: hidden;
    }


    .page {
      width: min(100%, 460px);
      max-width: 460px;
      margin: 0 auto;
    }


    .card {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(145deg, rgba(255,255,255,.48), rgba(226,242,255,.20)),
        rgba(255,255,255,.24);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 32px;
      box-shadow:
        0 35px 90px rgba(10,73,132,.20),
        inset 0 1px 0 rgba(255,255,255,.88),
        inset 0 -1px 0 rgba(255,255,255,.18);
      backdrop-filter: blur(30px) saturate(155%);
      -webkit-backdrop-filter: blur(30px) saturate(155%);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      border-radius: 31px;
      background:
        radial-gradient(circle at 8% 5%, rgba(255,255,255,.72), transparent 28%),
        radial-gradient(circle at 95% 90%, rgba(54,161,255,.20), transparent 34%);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 170%;
      height: 120px;
      left: -35%;
      top: -65px;
      transform: rotate(-8deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.40), transparent);
      filter: blur(18px);
      pointer-events: none;
    }


    .cover {
      height: 145px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.46), transparent 25%),
        radial-gradient(circle at 88% 80%, rgba(81,190,255,.42), transparent 34%),
        linear-gradient(135deg, #0877d1 0%, #0b5bb3 45%, #07356f 100%);
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 20%, rgba(255,255,255,.18) 45%, transparent 70%);
      transform: translateX(-60%);
      animation: glassSweep 7s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes glassSweep {
      0%, 45% { transform: translateX(-65%); }
      75%, 100% { transform: translateX(65%); }
    }


    .content {
      padding: 0 25px 25px;
      text-align: center;
    }


    .photo-wrap {
      width: 132px;
      height: 132px;
      margin: -66px auto 17px;
      position: relative;
      z-index: 5;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,.95), rgba(157,220,255,.52));
      box-shadow:
        0 18px 42px rgba(0,67,128,.25),
        0 0 0 1px rgba(255,255,255,.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }


    .photo {
      width: 124px;
      height: 124px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.94);
      background: #eaf6ff;
      box-shadow:
        0 10px 28px rgba(0,55,110,.22);
      display: block;
      opacity: 1;
    }


    .initials {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid #fff;
      background: #0b1220;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      box-shadow:
        0 8px 30px rgba(15,23,42,.18);
    }


    .name {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.4px;
    }


    .designation {
      margin-top: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #475467;
    }


    .department {
      margin-top: 3px;
      font-size: 12px;
      color: #667085;
    }


    .company {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }



    /* =====================================================
       SPECIALTY BADGES — HEX / AWARD STYLE
       ===================================================== */

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 14px 18px;
      margin: 14px auto 2px;
      max-width: 100%;
    }

    .badge-item {
      position: relative;
      width: 82px;
      height: 82px;
      flex: 0 0 82px;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 9px 14px rgba(10,70,135,.18));
    }

    .badge-hex {
      position: absolute;
      inset: 4px 0 9px;
      clip-path: polygon(
        25% 2%, 75% 2%,
        100% 28%, 92% 72%,
        75% 98%, 25% 98%,
        8% 72%, 0 28%
      );
      border: 0;
      background: linear-gradient(145deg, var(--b1), var(--b2));
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -8px 18px rgba(0,0,0,.10);
    }

    .badge-hex::before {
      content: "";
      position: absolute;
      inset: 1px;
      clip-path: inherit;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.48) 0 26%,
          transparent 26% 100%
        );
      opacity: .72;
    }

    .badge-core {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.94);
      border: 2px solid rgba(255,255,255,.95);
      color: var(--bc);
      box-shadow:
        0 4px 12px rgba(0,0,0,.10),
        inset 0 1px 0 rgba(255,255,255,.95);
      z-index: 2;
    }

    .badge-core svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .badge-label {
      position: absolute;
      z-index: 4;
      left: -7px;
      right: -7px;
      bottom: 0;
      min-height: 23px;
      padding: 4px 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(34,42,52,.94), rgba(17,24,32,.96));
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      font-size: 8.5px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .35px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,.18);
    }

    .badge-dg        { --b1:#ffe55b; --b2:#ff9d00; --bc:#f07800; }
    .badge-pharma    { --b1:#54e0ce; --b2:#087d75; --bc:#087d75; }
    .badge-projects  { --b1:#b56cff; --b2:#5620a8; --bc:#6828bd; }
    .badge-qa        { --b1:#ff7360; --b2:#c91f22; --bc:#c51e22; }
    .badge-operations{--b1:#63d9d2; --b2:#078d87; --bc:#078d87; }
    .badge-sales     { --b1:#66cfff; --b2:#1467c8; --bc:#176dcc; }
    .badge-finance   { --b1:#83b9ff; --b2:#1f5bb4; --bc:#1f5bb4; }
    .badge-hr        { --b1:#ff86bc; --b2:#c62573; --bc:#bd246e; }
    .badge-it        { --b1:#8d9cff; --b2:#3438b8; --bc:#3438b8; }
    .badge-management{--b1:#f7d66d; --b2:#a36a12; --bc:#9b6611; }
    .badge-specialist{--b1:#6dd6ff; --b2:#1169bd; --bc:#126bbd; }
    .badge-enthusiast{--b1:#ff8f5b; --b2:#e43b17; --bc:#dd3918; }
    .badge-initiator { --b1:#ffe34f; --b2:#e99600; --bc:#e88d00; }
    .badge-support   { --b1:#78e2b1; --b2:#16845b; --bc:#16845b; }
    .badge-default   { --b1:#b9d9f8; --b2:#3979ba; --bc:#2868ad; }

    @media (max-width: 360px) {
      .badges {
        gap: 10px 11px;
      }

      .badge-item {
        width: 72px;
        height: 72px;
        flex-basis: 72px;
      }

      .badge-core {
        width: 40px;
        height: 40px;
        top: 14px;
      }

      .badge-core svg {
        width: 21px;
        height: 21px;
      }

      .badge-label {
        font-size: 7.5px;
        min-height: 21px;
      }
    }

    .divider {
      height: 1px;
      background: #eaecf0;
      margin: 21px 0;
    }


    .details {
      text-align: left;
      display: grid;
      gap: 11px;
    }


    .detail {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 13px;
      border-radius: 17px;
      background: linear-gradient(135deg, rgba(255,255,255,.46), rgba(231,246,255,.22));
      border: 1px solid rgba(255,255,255,.58);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.58),
        0 8px 24px rgba(12,87,150,.06);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
    }


    .icon {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,.70), rgba(89,184,255,.22));
      border: 1px solid rgba(255,255,255,.65);
      color: #075da8;
      font-size: 14px;
      font-weight: 800;
      flex: 0 0 32px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }


    .detail-text {
      min-width: 0;
      flex: 1;
    }


    .detail-label {
      font-size: 10px;
      color: #98a2b3;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
    }


    .detail-value {
      margin-top: 2px;
      font-size: 13px;
      color: #344054;
      word-break: break-word;
    }


    .detail-value a {
      color: #344054;
      text-decoration: none;
    }


    .buttons {
      display: grid;
      gap: 9px;
      margin-top: 22px;
    }


    .btn {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }


    .btn-primary {
      background: linear-gradient(135deg, #087fe1, #0756a7);
      color: #fff;
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: 0 12px 28px rgba(0,91,173,.24), inset 0 1px 0 rgba(255,255,255,.35);
    }


    .btn-secondary {
      background: linear-gradient(135deg, rgba(255,255,255,.58), rgba(223,242,255,.30));
      color: #07559d;
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 8px 20px rgba(0,73,137,.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }


    .btn:active {
      transform: scale(.985);
    }


    .footer {
      margin-top: 18px;
      font-size: 10px;
      color: #98a2b3;
      line-height: 1.5;
    }


    .loader {
      position: fixed;
      inset: 0;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition:
        opacity .25s ease,
        visibility .25s ease;
    }


    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }


    .loader-box {
      text-align: center;
    }


    .spinner {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 3px solid #d9dee7;
      border-top-color: #0b1220;
      animation:
        spin .8s linear infinite;
      margin: auto;
    }


    .loader-text {
      margin-top: 13px;
      font-size: 13px;
      font-weight: 700;
      color: #475467;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    .error {
      display: none;
      text-align: center;
      padding: 45px 25px;
    }


    .error.show {
      display: block;
    }


    .error-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }


    .error h2 {
      margin: 0;
      font-size: 21px;
    }


    .error p {
      margin:
        8px 0 20px;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }


    @media (max-width: 520px) {

      body {
        padding: 8px;
        align-items: center;
      }

      .page {
        width: 100%;
        max-width: 460px;
      }

      .card {
        min-height: calc(100dvh - 16px);
        border-radius: 26px;
      }

      .cover {
        height: clamp(105px, 29vw, 135px);
      }

      .content {
        padding-left: clamp(14px, 5vw, 22px);
        padding-right: clamp(14px, 5vw, 22px);
      }

      .badges {
        padding: 0 4px;
      }

      .details {
        gap: 9px;
      }

      .detail {
        padding: 10px;
      }

      .btn {
        min-height: 47px;
      }
    }

    @media (max-width: 360px) {

      body {
        padding: 4px;
      }

      .card {
        min-height: calc(100dvh - 8px);
        border-radius: 22px;
      }

      .name {
        font-size: 22px;
      }

      .detail-value {
        font-size: 12px;
      }
    }

    @media (min-width: 521px) {

      .page {
        width: min(92vw, 460px);
      }
    }

<body>

  <!-- LOADING -->

  <div
    class="loader"
    id="loader"
  >

<div class="loader-box">

  <div class="spinner"></div>

  <div class="loader-text">
    Loading contact...
  </div>

</div>


  </div>

  <div class="page">


<div
  class="card"
  id="card"
  style="display:none;"
>


  <div class="cover"><img class="brand-logo" src="https://raw.githubusercontent.com/PharmaQA-ops/ggl-main-dashboard/main/logo.png" alt="Gaerish Logistics"></div>


  <div class="content">


    <!-- PHOTO -->

    <div class="photo-wrap">

      <img
        id="photo"
        class="photo"
        alt="Employee photo"
      >

      <div
        id="initials"
        class="initials"
      ></div>

    </div>


    <!-- NAME -->

    <h1
      class="name"
      id="name"
    ></h1>


    <div
      class="designation"
      id="designation"
    ></div>


    <div
      class="department"
      id="department"
    ></div>


    <div
      class="company"
      id="company"
    ></div>

    <div
      class="badges"
      id="badges"
      aria-label="Department badges"
    ></div>


    <div class="divider"></div>


    <!-- DETAILS -->

    <div class="details">


      <div
        class="detail"
        id="mobileRow"
      >

        <div class="icon">
          ☎
        </div>

        <div class="detail-text">

          <div class="detail-label">
            Mobile
          </div>

          <div
            class="detail-value"
            id="mobile"
          ></div>

        </div>

      </div>


      <div
        class="detail"
        id="whatsappRow"
      >

        <div class="icon">
          W
        </div>

        <div class="detail-text">

          <div class="detail-label">
            WhatsApp
          </div>

          <div
            class="detail-value"
            id="whatsapp"
          ></div>

        </div>

      </div>


      <div
        class="detail"
        id="emailRow"
      >

        <div class="icon">

    function loadContact() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const employeeId =
        (
          params.get('employee') ||
          params.get('id') ||
          ''
        )
        .trim()
        .toUpperCase();


      if (!employeeId) {

        showError(
          'Employee ID is missing from the contact link.'
        );

        return;

      }


      const callbackName =
        'gglContactCallback_' +
        Date.now();


      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              !response.success ||
              !response.employee
            ) {

              showError(
                getApiError(
                  response
                )
              );

              return;

            }


            employee =
              response.employee;


            renderContact(
              employee

          }

          catch (error) {

            showError(
              error.message
            );

          }

          finally {

            cleanupJsonp(
              script,
              callbackName
            );

          }

        };


      const script =
        document.createElement(
          'script'
        );


      script.src =
        API_URL +
        '?action=contact' +
        '&employee=' +
        encodeURIComponent(
          employeeId
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +
        '&v=' +
        Date.now();


      script.onerror =
        function() {

          showError(
            'Unable to connect to the contact service.'
          );

          cleanupJsonp(
            script,
            callbackName
          );

        };


      document.body.appendChild(
        script
      );

    }

    function renderBadges(data) {

      const container =
        document.getElementById('badges');

      if (!container) {

      container.innerHTML =

          return (

            '</div>'
          );

        }).join('');

      container.style.display =
        badges.length ? 'flex' : 'none';
    }


    function normalizeBadgeList(value) {

      if (Array.isArray(value)) {

        return value
          .map(function(item) {

            if (typeof item === 'string') {
              return normalizeBadgeValue(item);
            }

            return {
              key:
                String(
                  item.key ||
                  item.id ||
                  item.name ||
                  ''
                ).trim().toUpperCase(),

              label:
                String(
                  item.label ||
                  item.name ||
                  item.key ||
                  ''
                ).trim()
            };

          })
          .filter(function(item) {
            return item.key && item.label;
          });

      }

      if (typeof value === 'string') {

        return value
          .split(/[|,;\n]+/)
          .map(normalizeBadgeValue)
          .filter(function(item) {
            return item.key && item.label;
          });

      }

      return [];
    }


    function normalizeBadgeValue(value) {

      const raw =
        String(value || '').trim();

      const key =
        raw
          .toUpperCase()
          .replace(/[^A-Z0-9]+/g, '_');

      return {
        key: key,
        label: raw
      };
    }


    /* =====================================================
       PHOTO
       ===================================================== */

    function renderPhoto(
      photoUrl,
      name
    ) {

      const photo =
        document.getElementById(
          'photo'
        );

      const initials =
        document.getElementById(
          'initials'
        );

      const raw =
        String(
          photoUrl || ''
        ).trim();

      if (!raw) {
        showInitials(name);
        return;
      }

      /*
       * Try several Google Drive delivery formats.
       * This is important because a Drive "view" URL can work
       * on desktop but fail as an <img> source on some mobiles.
       */
      const candidates =
        buildPhotoCandidates(raw);

      let index = 0;

      photo.style.display = 'block';
      initials.style.display = 'none';

      photo.onload =
        function() {
          photo.style.display = 'block';
          initials.style.display = 'none';
        };

      photo.onerror =
        function() {
          index++;

          if (index < candidates.length) {
            photo.src = candidates[index];
          } else {
            showInitials(name);
          }
        };

      photo.src = candidates[0];
    }


    function buildPhotoCandidates(value) {

      const url =
        String(value || '').trim();

      if (!url) {
        return [];
      }

      const candidates = [];

      const driveMatch =
        url.match(
          /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^#]*id=)([A-Za-z0-9_-]+)/
        );

      if (driveMatch) {

        const id = driveMatch[1];

        candidates.push(
          'https://drive.google.com/thumbnail?id=' +
          encodeURIComponent(id) +
          '&sz=w1000'
        );

        candidates.push(
          'https://drive.google.com/uc?export=view&id=' +
          encodeURIComponent(id)
        );

        candidates.push(
          'https://drive.google.com/uc?export=download&id=' +
          encodeURIComponent(id)
        );
      }

      candidates.push(url);

      return [...new Set(candidates)];
    }


    function normalizePhotoUrl(
      value
    ) {

      const url =
        String(
          value || ''
        ).trim();

      if (!url) {
        return '';
      }

      /*
       * Accept a normal image URL or a
       * Google Drive file URL.
       */
      const driveMatch =
        url.match(
          /drive\.google\.com\/file\/d\/([^/]+)/
        );

      if (driveMatch) {

        return (
          'https://drive.google.com/uc?export=view&id=' +
          encodeURIComponent(
            driveMatch[1]
          )
        );

      }

      return url;

    }


    function getPhotoCandidates(value) {
      const url = String(value || '').trim();
      if (!url) return [];

      const candidates = [];
      const driveMatch = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([^/&?]+)/);

      if (driveMatch) {
        const id = driveMatch[1];
        candidates.push(
          'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1000'
        );
        candidates.push(
          'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(id)
        );
      }

      candidates.push(url);

      return [...new Set(candidates)];
    }

    /* =====================================================
       ADD TO CONTACTS
       ===================================================== */

    async function addToContacts() {

      if (!employee) {
        return;
      }

      const vcard = createVCard(employee);

      const safeName =
        String(
          employee.name ||
          employee.employeeId ||
          'contact'
        )
        .replace(/[^a-z0-9 _-]/gi, '')
        .trim() || 'contact';

      const fileName = safeName + '.vcf';

      const blob = new Blob(
        [vcard],
        {
          type: 'text/vcard;charset=utf-8'
        }
      );

      /*
       * MOBILE-FIRST:
       * Try the native phone share sheet with the VCF attached.
       * This avoids the old contact-service dependency completely.
       */
      try {

        const file = new File(
          [blob],
          fileName,
          {
            type: 'text/vcard'
          }
        );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          await navigator.share({
            title:
              employee.name ||
              'Gaerish Logistics Contact',

            text:
              'Save this contact to your phone.',

            files: [file]
          });

          return;
        }

      } catch (error) {

        /*
         * AbortError means the user closed/cancelled
         * the native share sheet. Do not show an error.
         */
        if (
          error &&
          error.name === 'AbortError'
        ) {
          return;
        }

      }

      /*
       * FALLBACK:
       * Generate the VCF locally and download it.
       * No Apps Script contact service is required.
       */
      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement('a');

      link.href = url;
      link.download = fileName;
      link.style.display = 'none';

      document.body.appendChild(link);

      link.click();

      link.remove();

      setTimeout(
        function() {
          URL.revokeObjectURL(url);
        },
        3000
      );

    }


    /* =====================================================
       VCARD GENERATOR
       ===================================================== */

    function createVCard(
      data
    ) {

      let vcard =
        'BEGIN:VCARD\r\n';

      vcard +=
        'VERSION:3.0\r\n';

      vcard +=
        'FN:' +
        vcardEscape(
          data.name
        ) +
        '\r\n';

      vcard +=
        'N:' +
        vcardEscape(
          data.name
        ) +
        ';;;;\r\n';


      if (data.company) {

        vcard +=
          'ORG:' +
          vcardEscape(
            data.company
          ) +
          '\r\n';

      }


      if (data.designation) {

        vcard +=
          'TITLE:' +
          vcardEscape(
            data.designation
          ) +
          '\r\n';

      }


      if (data.department) {

        vcard +=
          'ROLE:' +
          vcardEscape(
            data.department
          ) +
          '\r\n';

      }


      if (data.mobile) {

        vcard +=
          'TEL;TYPE=CELL:' +
          vcardEscape(
            data.mobile
          ) +
          '\r\n';

      }


      if (
        data.whatsapp &&
        data.whatsapp !==
          data.mobile
      ) {

        vcard +=
          'TEL;TYPE=WORK:' +
          vcardEscape(
            data.whatsapp
          ) +
          '\r\n';

      }


      if (data.email) {

        vcard +=
          'EMAIL;TYPE=WORK:' +
          vcardEscape(
            data.email
          ) +
          '\r\n';

      }


      if (data.website) {

        vcard +=
          'URL:' +
          vcardEscape(
            normalizeUrl(
              data.website
            )
          ) +
          '\r\n';

      }


      if (data.linkedin) {

        vcard +=
          'X-SOCIALPROFILE;TYPE=linkedin:' +
          vcardEscape(
            normalizeUrl(
              data.linkedin
            )
          ) +
          '\r\n';

      }


      if (data.address) {

        vcard +=
          'ADR;TYPE=WORK:;;' +
          vcardEscape(
            data.address
          ) +
          ';;;;\r\n';

      }


      if (data.employeeId) {

        vcard +=
          'NOTE:GGL Employee ID - ' +
          vcardEscape(
            data.employeeId
          ) +
          '\r\n';

      }


      vcard +=
        'END:VCARD';


      return vcard;

    }


    function vcardEscape(
      value
    ) {

      return String(
        value || ''
      )

      .replace(
        /\\/g,
        '\\\\'
      )

      .replace(
        /\r?\n/g,
        '\\n'
      )

      .replace(
        /;/g,
        '\\;'
      )

      .replace(
        /,/g,
        '\\,'
      );

    }


    /* =====================================================
       SHARE
       ===================================================== */

    async function shareCard() {

      const url =
        window.location.href;


      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              employee
                ? employee.name
                : 'GGL Contact',

            text:
              employee
                ? employee.name +
                  ' — ' +
                  (
                    employee.designation ||
                    'Gaerish Logistics'
                  )
                : 'Gaerish Logistics contact',

            url:
              url

          });

          return;

        }

        catch (error) {

          /*
           * User cancelled share.
           */

        }

      }


      copyText(
        url,
        'Contact link copied.'
      );

    }


    /* =====================================================
       COPY
       ===================================================== */

    function copyCardLink() {

      copyText(
        window.location.href,
        'Contact link copied.'
      );

    }


    async function copyText(
      text,
      successMessage
    ) {

      try {

        if (
          navigator.clipboard &&
          navigator.clipboard.writeText
        ) {

          await navigator.clipboard.writeText(
            text
          );

        }

        else {

          const input =
            document.createElement(
              'textarea'
            );

          input.value =
            text;

          input.style.position =
            'fixed';

          input.style.opacity =
            '0';

          document.body.appendChild(
            input
          );

          input.select();

          document.execCommand(
            'copy'
          );

          input.remove();

        }


        alert(
          successMessage
        );

      }

      catch (error) {

        alert(
          'Unable to copy the contact link.'
        );

      }

    }


    /* =====================================================
       ERROR
       ===================================================== */

    function showError(
      message
    ) {

      document.getElementById(
        'loader'
      )
      .classList
      .add('hidden');


      document.getElementById(
        'card'
      ).style.display =
        'none';


      document.getElementById(
        'errorCard'
      ).style.display =
        'block';


      document.getElementById(
        'errorMessage'
      ).textContent =
        message ||
        'The requested employee contact could not be found.';

    }


    function getApiError(
      response
    ) {

      if (!response) {

        return 'No response received from the contact service.';

      }


      switch (
        response.error
      ) {

        case 'EMPLOYEE_ID_REQUIRED':

          return 'Employee ID is missing.';

        case 'EMPLOYEE_NOT_FOUND':

          return 'Employee contact was not found.';

        case 'CONTACT_UNAVAILABLE':

          return 'This employee contact is currently unavailable.';

        case 'INVALID_CALLBACK':

          return 'Invalid contact request.';

        default:

          return (
            response.error ||
            'Contact unavailable.'
          );

      }

    }


    /* =====================================================
       GENERAL HELPERS
       ===================================================== */

    function setText(
      id,
      value
    ) {

      document.getElementById(
        id
      ).textContent =
        value || '';

    }


    function getInitials(
      name
    ) {

      const parts =
        String(
          name || ''
        )
        .trim()
        .split(/\s+/)
        .filter(Boolean);


      if (!parts.length) {

        return 'G';

      }


      if (
        parts.length === 1
      ) {

        return parts[0]
          .substring(0,2)
          .toUpperCase();

      }


      return (
        parts[0][0] +
        parts[
          parts.length - 1
        ][0]
      ).toUpperCase();

    }


    function normalizeUrl(
      value
    ) {

      const text =
        String(
          value || ''
        ).trim();


      if (!text) {

        return '';

      }


      if (
        /^https?:\/\//i.test(
          text
        )
      ) {

        return text;

      }


      return 'https://' + text;

    }


    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ''
          : value
      )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

    }


    function escapeAttr(
      value
    ) {

      return escapeHtml(
        value
      );

    }


  </script>
