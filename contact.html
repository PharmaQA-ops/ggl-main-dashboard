<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>Contact | Gaerish Logistics</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: #f5f7fa;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f5f7fa 100%
        );

      color: #111827;

      -webkit-font-smoothing: antialiased;

      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom)
        0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
    }


    /* =================================================
       PAGE
       ================================================= */

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }


    /* =================================================
       BRAND
       ================================================= */

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 18px;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #374151;
    }


    /* =================================================
       CARD
       ================================================= */

    .contact-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 26px 20px 22px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.07);
    }


    /* =================================================
       PROFILE
       ================================================= */

    .profile {
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #111827,
          #374151
        );

      color: #ffffff;

      font-size: 30px;
      font-weight: 700;

      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-size: 25px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #111827;
    }

    .designation {
      margin-top: 7px;
      font-size: 15px;
      line-height: 1.4;
      color: #4b5563;
      font-weight: 500;
    }

    .department {
      margin-top: 3px;
      font-size: 14px;
      color: #6b7280;
    }

    .company {
      margin-top: 5px;
      font-size: 14px;
      font-weight: 650;
      color: #374151;
    }


    /* =================================================
       ADD CONTACT
       ================================================= */

    .add-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      width: 100%;

      margin-top: 22px;
      padding: 15px 18px;

      border: 0;
      border-radius: 14px;

      background: #111827;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(17, 24, 39, 0.18);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .add-contact:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .add-contact svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }


    /* =================================================
       ACTIONS
       ================================================= */

    .actions {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      margin-top: 18px;
    }

    .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 70px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      background: #fafafa;

      color: #374151;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .action:active {
      transform: scale(0.97);
      background: #f3f4f6;
    }

    .action-icon {
      width: 23px;
      height: 23px;
      margin-bottom: 7px;
    }

    .action-label {
      font-size: 11px;
      font-weight: 650;
    }


    /* =================================================
       INFORMATION
       ================================================= */

    .info {
      margin-top: 24px;
      border-top: 1px solid #e5e7eb;
      padding-top: 6px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 13px;

      padding: 14px 2px;

      border-bottom: 1px solid #f0f1f3;
    }

    .info-icon {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      color: #6b7280;
      margin-top: 1px;
    }

    .info-content {
      min-width: 0;
      flex: 1;
    }

    .info-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: #9ca3af;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 14px;
      line-height: 1.45;
      color: #374151;
      word-break: break-word;
    }

    .info-value a {
      color: #374151;
    }


    /* =================================================
       FOOTER
       ================================================= */

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 11px;
      line-height: 1.5;
    }


    /* =================================================
       LOADING
       ================================================= */

    .loading {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;
    }

    .spinner {
      width: 38px;
      height: 38px;

      border: 3px solid #e5e7eb;
      border-top-color: #111827;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;

      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 14px;
      color: #6b7280;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =================================================
       ERROR
       ================================================= */

    .error {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .error-card {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 20px;

      padding: 30px 22px;

      text-align: center;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.07);
    }

    .error-title {
      font-size: 20px;
      font-weight: 750;
      color: #111827;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 14px;
      line-height: 1.5;
      color: #6b7280;
    }


    /* =================================================
       DESKTOP
       ================================================= */

    @media (min-width: 700px) {

      body {
        padding-top: 40px;
        padding-bottom: 40px;
      }

      .page {
        min-height: auto;
      }

      .contact-card {
        padding: 32px 28px 26px;
      }
    }

  </style>
</head>

  <script>

    /*
     * =================================================
     * CONFIGURATION
     * =================================================
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbyOnaQEYIqjIqdAeBY8KNk0brPmJ4IvBA5pPHfvdDhP18zFknmOwmPw8R-9PG8hS7lLIg/exec';


    /*
     * =================================================
     * GET EMPLOYEE ID FROM URL
     * =================================================
     */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const employeeId =
      params.get('employee');


    /*
     * =================================================
     * DOM
     * =================================================
     */

    const loading =
      document.getElementById(
        'loading'
      );

    const app =
      document.getElementById(
        'app'
      );

    const error =
      document.getElementById(
        'error'
      );

    const errorMessage =
      document.getElementById(
        'errorMessage'
      );


    /*
     * =================================================
     * LOAD CONTACT
     * =================================================
     */

    async function loadContact() {

      if (!employeeId) {

        showError(
          'No employee ID was provided.'
        );

        return;
      }


      try {

        const url =
          API_URL +
          '?action=contact&employee=' +
          encodeURIComponent(
            employeeId
          );


        const response =
          await fetch(
            url,
            {
              method: 'GET',
              cache: 'no-store',
              redirect: 'follow'
            }
          );


        if (!response.ok) {

          throw new Error(
            'API HTTP ' +
            response.status
          );
        }


        const data =
          await response.json();


        if (
          !data.success
        ) {

          throw new Error(
            data.error ||
            'Employee not found'
          );
        }


        renderContact(data);


      } catch (err) {

        console.error(
          'Contact API error:',
          err
        );

        showError(
          'Unable to load this contact. Please check the QR code or try again.'
        );
      }
    }


    /*
     * =================================================
     * RENDER CONTACT
     * =================================================
     */

    function renderContact(data) {

      setText(
        'name',
        data.name
      );

      setText(
        'designation',
        data.designation
      );

      setText(
        'department',
        data.department
      );

      setText(
        'company',
        data.company
      );


      /*
       * Avatar initials
       */

      const avatar =
        document.getElementById(
          'avatar'
        );

      avatar.textContent =
        getInitials(
          data.name
        );


      /*
       * Add Contact
       */

      const addContact =
        document.getElementById(
          'addContact'
        );

      if (data.vCardUrl) {

        addContact.href =
          data.vCardUrl;

        addContact.download =
          data.employeeId +
          '.vcf';

        addContact.target =
          '_blank';

      } else {

        addContact.style.display =
          'none';
      }


      /*
       * Call
       */

      const callAction =
        document.getElementById(
          'callAction'
        );

      if (data.mobile) {

        callAction.href =
          'tel:' +
          normalizePhone(
            data.mobile
          );

      } else {

        callAction.style.display =
          'none';
      }


      /*
       * WhatsApp
       */

      const whatsappAction =
        document.getElementById(
          'whatsappAction'
        );

      const whatsappNumber =
        data.whatsapp ||
        data.mobile;

      if (whatsappNumber) {

        whatsappAction.href =
          'https://wa.me/' +
          normalizeWhatsApp(
            whatsappNumber
          );

      } else {

        whatsappAction.style.display =
          'none';
      }


      /*
       * Email
       */

      const emailAction =
        document.getElementById(
          'emailAction'
        );

      if (data.email) {

        emailAction.href =
          'mailto:' +
          data.email;

      } else {

        emailAction.style.display =
          'none';
      }


      /*
       * Website
       */

      const websiteAction =
        document.getElementById(
          'websiteAction'
        );

      if (data.website) {

        websiteAction.href =
          normalizeUrl(
            data.website
          );

      } else {

        websiteAction.style.display =
          'none';
      }


      /*
       * Information
       */

      renderOptionalRow(
        'mobileRow',
        'mobile',
        data.mobile
      );

      renderOptionalRow(
        'emailRow',
        'email',
        data.email
      );

      renderOptionalRow(
        'addressRow',
        'address',
        data.address
      );


      /*
       * LinkedIn
       */

      const linkedinRow =
        document.getElementById(
          'linkedinRow'
        );

      const linkedin =
        document.getElementById(
          'linkedin'
        );

      if (data.linkedin) {

        linkedin.innerHTML =
          '<a href="' +
          escapeHtml(
            normalizeUrl(
              data.linkedin
            )
          ) +
          '" target="_blank" rel="noopener">' +
          escapeHtml(
            data.linkedin
          ) +
          '</a>';

      } else {

        linkedinRow.style.display =
          'none';
      }


      /*
       * Show page
       */

      loading.style.display =
        'none';

      app.style.display =
        'block';
    }


    /*
     * =================================================
     * OPTIONAL ROW
     * =================================================
     */

    function renderOptionalRow(
      rowId,
      valueId,
      value
    ) {

      const row =
        document.getElementById(
          rowId
        );

      const element =
        document.getElementById(
          valueId
        );

      if (!value) {

        row.style.display =
          'none';

        return;
      }

      element.textContent =
        value;
    }


    /*
     * =================================================
     * TEXT
     * =================================================
     */

    function setText(
      id,
      value
    ) {

      const element =
        document.getElementById(
          id
        );

      if (element) {

        element.textContent =
          value || '';
      }
    }


    /*
     * =================================================
     * INITIALS
     * =================================================
     */

    function getInitials(
      name
    ) {

      if (!name) {
        return '?';
      }

      const words =
        name
          .trim()
          .split(/\s+/)
          .filter(Boolean);


      if (words.length === 1) {

        return words[0]
          .substring(0, 2)
          .toUpperCase();
      }


      return (
        words[0][0] +
        words[words.length - 1][0]
      ).toUpperCase();
    }


    /*
     * =================================================
     * PHONE
     * =================================================
     */

    function normalizePhone(
      value
    ) {

      return String(value)
        .trim()
        .replace(
          /[^\d+]/g,
          ''
        );
    }


    /*
     * =================================================
     * WHATSAPP
     * =================================================
     */

    function normalizeWhatsApp(
      value
    ) {

      let phone =
        String(value)
          .trim()
          .replace(
            /\D/g,
            ''
          );


      /*
       * India:
       * If number is stored as
       * 9876543210, add 91.
       */

      if (
        phone.length === 10
      ) {

        phone =
          '91' +
          phone;
      }


      /*
       * If stored with 0091
       */

      if (
        phone.startsWith('00')
      ) {

        phone =
          phone.substring(2);
      }


      return phone;
    }


    /*
     * =================================================
     * URL
     * =================================================
     */

    function normalizeUrl(
      value
    ) {

      const url =
        String(value)
          .trim();


      if (
        /^https?:\/\//i.test(
          url
        )
      ) {

        return url;
      }


      return (
        'https://' +
        url
      );
    }


    /*
     * =================================================
     * HTML ESCAPE
     * =================================================
     */

    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );
    }


    /*
     * =================================================
     * ERROR
     * =================================================
     */

    function showError(
      message
    ) {

      loading.style.display =
        'none';

      app.style.display =
        'none';

      error.style.display =
        'flex';

      errorMessage.textContent =
        message;
    }


    /*
     * =================================================
     * START
     * =================================================
     */

    loadContact();

  </script>
