<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GGL QR Directory</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.head h1{margin:0;font-size:26px}.head p{margin:6px 0 0;color:#687386}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700;background:#172033;color:#fff}.btn.secondary{background:#fff;color:#172033;border:1px solid #d8dee9}.search{width:100%;padding:13px 15px;border:1px solid #d8dee9;border-radius:10px;margin-bottom:16px;font-size:15px}.status{margin:10px 0 16px;color:#687386}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:18px;box-shadow:0 3px 12px rgba(20,30,50,.05)}.id{font-size:13px;font-weight:800;color:#687386}.name{font-size:19px;font-weight:800;margin:6px 0}.meta{font-size:14px;color:#687386;line-height:1.6;min-height:45px}.download{display:block;text-align:center;text-decoration:none;margin-top:15px;padding:11px;border-radius:9px;background:#0878e8;color:#fff;font-weight:700}.empty{text-align:center;padding:50px;color:#687386;background:#fff;border-radius:14px;border:1px solid #e2e7ef}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Gaerish Logistics — QR Directory</h1><p>Existing employee QR codes only. No QR regeneration.</p></div>
    <div class="actions"><button class="btn" id="zipBtn" onclick="downloadZip()">Download All QR ZIP</button><button class="btn secondary" onclick="loadDirectory()">Refresh</button></div>
  </div>
  <input class="search" id="search" placeholder="Search employee ID, name, designation or department" oninput="render()">
  <div class="status" id="status">Connecting to QR service...</div>
  <div class="grid" id="grid"></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbyOnaQEYIqjIqdAeBY8KNk0brPmJ4IvBA5pPHfvdDhP18zFknmOwmPw8R-9PG8hS7lLIg/exec';
let rows=[];
let timeout;
function jsonp(url){return new Promise((resolve,reject)=>{const cb='gglQR_'+Date.now()+'_'+Math.floor(Math.random()*100000);const s=document.createElement('script');let done=false;function finish(err,data){if(done)return;done=true;clearTimeout(timeout);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('API script failed'));document.body.appendChild(s);s.src=url+'&callback='+encodeURIComponent(cb);timeout=setTimeout(()=>finish(new Error('API timeout')),15000)})}
async function loadDirectory(){document.getElementById('status').textContent='Loading QR directory...';try{const data=await jsonp(API+'?action=qrdirectory');if(!data||data.success!==true)throw new Error((data&&data.error)||'API_ERROR');rows=Array.isArray(data.employees)?data.employees:[];render();document.getElementById('status').textContent=rows.length+' existing QR code(s) available.'}catch(e){console.error(e);document.getElementById('status').textContent='Unable to connect to QR service: '+e.message;document.getElementById('grid').innerHTML='<div class="empty">QR service did not return data. Make sure the Apps Script Web App is deployed as a new version with access set to Anyone.</div>'}}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const data=rows.filter(x=>[x.employeeId,x.name,x.designation,x.department].join(' ').toLowerCase().includes(q));const grid=document.getElementById('grid');if(!data.length){grid.innerHTML='<div class="empty">No QR codes found.</div>';return}grid.innerHTML=data.map(x=>`<div class="card"><div class="id">${esc(x.employeeId)}</div><div class="name">${esc(x.name||'—')}</div><div class="meta">${esc(x.designation||'—')}<br>${esc(x.department||'—')}</div><a class="download" href="${escAttr(x.downloadUrl)}" download="${escAttr(x.fileName)}">Download ${esc(x.fileName)}</a></div>`).join('')}
async function downloadZip(){const b=document.getElementById('zipBtn');b.disabled=true;b.textContent='Preparing ZIP...';try{const d=await jsonp(API+'?action=qrzip');if(!d||!d.success)throw new Error((d&&d.error)||'ZIP_ERROR');window.location.href=d.downloadUrl}catch(e){alert('Unable to create QR ZIP: '+e.message)}finally{b.disabled=false;b.textContent='Download All QR ZIP'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(v){return esc(v)}
loadDirectory();
</script>
</body>
</html>
